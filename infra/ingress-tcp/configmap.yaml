# TCP stream passthrough for the MicroK8s nginx ingress controller.
# Lets raw-TCP services (databases) be reached on node1's host ports — which,
# with the controller in hostNetwork mode, are reachable over the NetBird overlay.
# Format:  "<listen-port>": "<namespace>/<service>:<service-port>"
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-ingress-tcp-microk8s-conf
  namespace: ingress
data:
  "5432": "database/timescaledb:5432"
  "6379": "database/redis-sentinel:6379"
  "26379": "database/redis-sentinel:26379"
  "3000": "database/tigerbeetle:3000"
  "9094": "database/kafka:9094"

  # What applications should use: pooling + read/write split, writes always land on the
  # current Patroni leader. Listen port matches pgdog's own 6432 so the connection string
  # is the same inside and outside the cluster.
  #
  # ⚠️ Reads may be STALE — replication is asynchronous, and a read in a separate
  # transaction right after a write can hit a replica that hasn't replayed it. Reads inside
  # the writing transaction are safe. See charts/timescaledb-ha/README.md.
  "6432": "database/timescaledb-ha-pgdog:6432"

  # Raw TCP to whichever node is currently the leader — no pooler in the path. This is the
  # one Debezium must use: logical decoding speaks the streaming-replication protocol,
  # which a transaction-mode pooler does not proxy. Also the right endpoint for
  # pg_basebackup, pg_dump of a consistent snapshot, and migrations that must not be
  # multiplexed onto a shared backend.
  "5433": "database/timescaledb-ha-haproxy:5000"
  # Replicas only, round-robin. Read-only by construction
  "5434": "database/timescaledb-ha-haproxy:5001"
