# TCP passthrough for the Traefik ingress controller.
#
# Replaces the nginx `nginx-ingress-tcp-microk8s-conf` ConfigMap. Traefik needs TWO
# pieces per service, not one:
#
#   1. an entryPoint + hostPort — static config, in apps/base/traefik.yaml
#   2. an IngressRouteTCP binding that entryPoint to a Service — this file
#
# Miss (1) and nothing listens. Miss (2) and the port listens but refuses every
# connection. Both must name the same entryPoint.
#
# `HostSNI(`*`)` is the catch-all match, and is the ONLY valid match for a non-TLS
# entryPoint: SNI is a TLS handshake field, so on a plaintext port there is no hostname
# to route on. One entryPoint therefore serves exactly one backend — which is why each
# database needs its own port, exactly as it did under nginx.
#
# These objects live in `database` because an IngressRouteTCP resolves Services in its
# own namespace.
#
# ⚠️ hostPort is iptables DNAT, not a listening socket. `ss -ltn` shows nothing on these
# ports even when they are working. Test with `nc -z node1 5432` or a real client.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: postgresql-ha
  namespace: database
spec:
  # The `postgres` entryPoint (hostPort 5432) previously pointed at the single-node
  # `timescaledb` chart, which is not deployed. It now serves postgresql-ha's HAProxy
  # primary, so `psql -h node1 -p 5432` reaches whichever node Patroni has elected leader.
  #
  # HAProxy, not pgdog: 5432 is the port people reach for with psql, pg_dump, migrations and
  # logical-decoding clients, and a transaction-mode pooler cannot serve the last of those.
  # Applications wanting pooling and the read/write split use pgdog on 6432 instead.
  #
  # ⚠️ One entryPoint serves exactly one backend (HostSNI(`*`) is the only valid match on a
  # plaintext port). Reviving the single-node timescaledb chart means giving it a different
  # port and entryPoint, not sharing this one.
  entryPoints: [ postgres ]
  routes:
    - match: HostSNI(`*`)
      services:
        - name: postgresql-ha-haproxy
          port: 5000
---
# Raw TCP to whichever node is currently the Patroni leader — no pooler in the path.
# The one endpoint Debezium must use: logical decoding speaks the streaming-replication
# protocol, which a transaction-mode pooler does not proxy. Also correct for
# pg_basebackup and migrations that must not be multiplexed onto a shared backend.
#
# Backend is the `postgresql-ha-primary` Service, which selects on `role: master` — the
# label Patroni rewrites on its own pod at every promotion — so this follows a failover
# without HAProxy in the path. Deliberately NOT postgresql-ha-haproxy:5000: that is what
# the `postgres` entryPoint (5432) already serves, and pointing both ports at the same
# backend would make 5433 a second name for 5432 rather than a shorter path.
#
# ⚠️ The cost of skipping HAProxy: during a failover there is a window where NO pod carries
# `role: master`, and this port refuses connections until Patroni relabels the new leader.
# HAProxy on 5432 rides that window out. Clients that cannot retry belong on 5432.
#
# Replaces timescaledb-ha-primary. That chart is not deployed — no Argo Application and no
# Services — so this entryPoint was bound to a backend that does not resolve. Reviving
# timescaledb-ha means giving it its own entryPoint and hostPort in apps/base/traefik.yaml,
# not sharing this one.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: postgresql-ha-primary
  namespace: database
spec:
  entryPoints: [ pg-primary ]
  routes:
    - match: HostSNI(`*`)
      services:
        - name: postgresql-ha-primary
          port: 5432
---
# What applications should use: pooling + read/write split, writes always landing on the
# current leader.
#
# ⚠️ Reads may be STALE — replication is asynchronous, and a read in a separate
# transaction right after a write can hit a replica that has not replayed it. Reads
# inside the writing transaction are safe. See charts/postgresql-ha/README.md.
#
# ⚠️ Transaction-mode pooling, so anything whose state must outlive a transaction does not
# belong here: logical decoding, LISTEN/NOTIFY, session advisory locks, temp tables,
# WITH HOLD cursors. Those take 5433 (direct to leader) or 5432 (via HAProxy).
#
# Replaces timescaledb-ha-pgdog, whose backend Service does not exist — see the note on
# postgresql-ha-primary above.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: postgresql-ha-pgdog
  namespace: database
spec:
  entryPoints: [ pgdog ]
  routes:
    - match: HostSNI(`*`)
      services:
        - name: postgresql-ha-pgdog
          port: 6432
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: redis
  namespace: database
spec:
  entryPoints: [ redis ]
  routes:
    - match: HostSNI(`*`)
      services:
        - name: redis-sentinel
          port: 6379
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: redis-sentinel
  namespace: database
spec:
  entryPoints: [ sentinel ]
  routes:
    - match: HostSNI(`*`)
      services:
        - name: redis-sentinel
          port: 26379
---
# SASL_PLAINTEXT listener. Authenticates via SCRAM but does NOT encrypt — see ACCESS.md.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: kafka
  namespace: database
spec:
  entryPoints: [ kafka ]
  routes:
    - match: HostSNI(`*`)
      services:
        - name: kafka
          port: 9094
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: tigerbeetle
  namespace: database
spec:
  entryPoints: [ tigerbeetle ]
  routes:
    - match: HostSNI(`*`)
      services:
        - name: tigerbeetle
          port: 3000
