# Grafana dashboard for the TimescaleDB HA stack, provisioned from Git.
#
# The k8s-sidecar container in the Grafana pod watches every namespace for ConfigMaps labelled
# grafana_dashboard=1 (LABEL/LABEL_VALUE in its env) and drops their contents into
# /tmp/dashboards. Grafana loads from there on the next scan — no API call, no UI import.
#
# ⚠️ Requires grafana.sidecar.skipTlsVerify on microk8s. Without it that sidecar CrashLoops on
# the API server's CA (no keyUsage extension) and this dashboard silently never appears.
#
# ⚠️ Provisioned dashboards are READ-ONLY in effect: edits made in the UI are overwritten on the
# next sidecar sync. To change a panel, edit it here — or "Save As" a copy in the UI, which
# lands on the Grafana PVC instead.
#
# Every PromQL expression below was executed against the live Prometheus before being committed;
# all 17 returned data with the expected series counts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-timescaledb-ha
  namespace: monitoring
  labels:
    # This label is the whole delivery mechanism. Without it the sidecar ignores the ConfigMap.
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: monitoring
data:
  timescaledb-ha.json: |
    {
      "uid": "timescaledb-ha",
      "title": "TimescaleDB HA",
      "description": "Patroni cluster, pgdog pooler and HAProxy. Provisioned from infra/monitoring/dashboard-timescaledb-ha.yaml \u2014 edits made in the UI are overwritten on the next sidecar sync.",
      "tags": [
        "timescaledb",
        "patroni",
        "pgdog",
        "haproxy",
        "database"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "editable": true,
      "panels": [
        {
          "type": "stat",
          "title": "Leader",
          "description": "The node currently holding the Patroni leader lock. Changes on every failover.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "patroni_primary == 1",
              "refId": "A",
              "range": false,
              "instant": true,
              "legendFormat": "{{name}}"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "name",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Leader lock",
          "description": "1 = nobody holds the lock, so every node is read-only and all writes fail. A normal failover clears it within ~20s (the configured ttl).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 5,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "max(patroni_cluster_unlocked)",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "HELD",
                      "color": "green",
                      "index": 0
                    },
                    "1": {
                      "text": "NO LEADER",
                      "color": "red",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Postgres running",
          "description": "Nodes with Postgres up, of 3. Two is survivable; one means the next failure is an outage.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 9,
            "y": 0,
            "w": 5,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(patroni_postgres_running)",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 2
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "HAProxy \u2192 primary",
          "description": "Backends passing Patroni's /primary check. 0 means the :5433 writer endpoint is dead \u2014 Debezium and migrations have nowhere to go.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 14,
            "y": 0,
            "w": 5,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "haproxy_backend_active_servers{proxy=\"primary\"}",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "HAProxy \u2192 replicas",
          "description": "Backends passing /replica. 0 means the :5434 read-only endpoint has nowhere to send traffic.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 19,
            "y": 0,
            "w": 5,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "haproxy_backend_active_servers{proxy=\"replicas\"}",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "state-timeline",
          "title": "Node role over time",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Every promotion is visible as a band change. This is the failover history \u2014 read it before trusting any lag or throughput panel below, because a failover explains most transients.",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 24,
            "h": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "patroni_primary",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "{{name}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "mergeValues": true,
            "showValue": "never",
            "rowHeight": 0.9,
            "tooltip": {
              "mode": "single"
            }
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "replica",
                      "color": "blue",
                      "index": 0
                    },
                    "1": {
                      "text": "PRIMARY",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "custom": {
                "lineWidth": 0,
                "fillOpacity": 90
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Replication lag",
          "description": "Bytes each replica is behind the leader. 16MB is the line where pgdog bans a replica from serving reads (ban_replica_lag_bytes), so crossing it silently cuts read capacity.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "(scalar(max(patroni_xlog_location)) - (patroni_xlog_replayed_location > 0))",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "{{name}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "axisPlacement": "auto",
                "gradientMode": "none"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Postgres timeline",
          "description": "Increments on every promotion. A step here is a failover that happened \u2014 the audit trail even if everything recovered before you looked.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 10,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "patroni_postgres_timeline",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "{{name}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": null,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "axisPlacement": "auto",
                "gradientMode": "none"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "pgdog: read/write split by role",
          "description": "The panel that proves the topology works. Writes must be ~0 on replicas \u2014 anything else means pgdog is routing writes to a non-leader. Reads spread across both roles under read_write_split=include_primary.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (role) (rate(total_reads{job=\"timescaledb-ha-pgdog\"}[5m]))",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "reads \u2192 {{role}}"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (role) (rate(total_writes{job=\"timescaledb-ha-pgdog\"}[5m]))",
              "refId": "B",
              "range": true,
              "instant": false,
              "legendFormat": "writes \u2192 {{role}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": null,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "axisPlacement": "auto",
                "gradientMode": "none"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "pgdog: transactions/sec by node",
          "description": "Throughput per backend. Uneven distribution across replicas suggests one is banned for lag or failing healthchecks.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 18,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (host) (rate(total_xact_count{job=\"timescaledb-ha-pgdog\"}[5m]))",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "{{host}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": null,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "axisPlacement": "auto",
                "gradientMode": "none"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "pgdog: pool saturation",
          "description": "Sustained clients-waiting above 0 means default_pool_size is too small for the load. Raise it only after checking max_connections on the backends \u2014 pgdog holds a pool per (user, node).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 26,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(cl_waiting{job=\"timescaledb-ha-pgdog\"})",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "clients waiting"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (role) (sv_active{job=\"timescaledb-ha-pgdog\"})",
              "refId": "B",
              "range": true,
              "instant": false,
              "legendFormat": "servers active \u2192 {{role}}"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (role) (sv_idle{job=\"timescaledb-ha-pgdog\"})",
              "refId": "C",
              "range": true,
              "instant": false,
              "legendFormat": "servers idle \u2192 {{role}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "axisPlacement": "auto",
                "gradientMode": "none"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "pgdog: errors",
          "description": "Server errors spike during a failover (expected, brief). Sustained errors mean a banned backend, drifted credentials, or exhausted max_connections.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 26,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(total_server_errors{job=\"timescaledb-ha-pgdog\"}[5m]))",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "server errors"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(total_rollbacks{job=\"timescaledb-ha-pgdog\"}[5m]))",
              "refId": "B",
              "range": true,
              "instant": false,
              "legendFormat": "auto rollbacks"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(out_of_sync{job=\"timescaledb-ha-pgdog\"}[5m]))",
              "refId": "C",
              "range": true,
              "instant": false,
              "legendFormat": "returned out of sync"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "axisPlacement": "auto",
                "gradientMode": "none"
              }
            },
            "overrides": []
          }
        }
      ]
    }

