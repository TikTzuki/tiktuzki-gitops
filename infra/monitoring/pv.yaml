# Static local PVs for the monitoring stack.
#
# This cluster has no StorageClass (`kubectl get sc` is empty), so nothing would provision the
# PVCs kube-prometheus-stack asks for. Each volume gets a class of its OWN rather than sharing
# one: the binder matches by class + size + accessMode, and a dedicated class per volume makes
# binding deterministic without having to predict the Prometheus operator's generated PVC name
# (which encodes the release and CR names and changes if either is renamed).
#
# Create the directories on node1 first, with the UIDs each image actually runs as:
#
#   sudo mkdir -p /srv/k8s-volumes/monitoring/{prometheus,grafana}
#   sudo chown -R 1000:2000 /srv/k8s-volumes/monitoring/prometheus   # prometheus runs 1000:2000
#   sudo chown -R 472:472   /srv/k8s-volumes/monitoring/grafana      # grafana runs 472:472
#
# Get the ownership wrong and the pod CrashLoops on "permission denied" opening its data dir.
#
# Reclaim policy is Retain on both — losing Grafana's SQLite means losing every dashboard
# built in the UI, and there is no other copy.
#
# ⚠️ The StorageClass OBJECTS below are not optional, even though nothing provisions anything.
# A PV that names a class does not bring that class into existence, and the Prometheus Operator
# explicitly validates the class before it will create the StatefulSet:
#
#   Reconciled=False :: ReconciliationFailed ::
#     storage class "monitoring-prometheus-local" does not exist
#
# — no Prometheus pod at all, and the Prometheus CR sits Available=False/StatefulSetNotFound.
# (A bare PVC does not behave this way; it just pends until a matching PV shows up. This
# validation is the operator's own, which is why the same pattern works fine for the
# timescaledb-ha StatefulSet and fails here.)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: monitoring-prometheus-local
provisioner: kubernetes.io/no-provisioner
# WaitForFirstConsumer, not Immediate: binding is deferred until a pod is scheduled, so the
# scheduler gets to honour the PV's nodeAffinity. With Immediate the volume can bind before
# scheduling and pin the pod to a node the scheduler would not have chosen.
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: monitoring-grafana-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: monitoring-prometheus-pv
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: monitoring-prometheus-local
  # Pre-bound by name, with NO uid — see the grafana PV below for why this matters.
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: monitoring
    name: prometheus-monitoring-kube-prometheus-prometheus-db-prometheus-monitoring-kube-prometheus-prometheus-0
  local:
    path: /srv/k8s-volumes/monitoring/prometheus
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node1
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: monitoring-grafana-pv
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: monitoring-grafana-local
  # ⚠️ claimRef WITHOUT a uid. This is what makes the volume survive PVC recreation, and it is
  # not optional here.
  #
  # A claimRef carrying a uid binds to one specific PVC object. The moment that object is
  # deleted and recreated — an Argo re-sync, a chart upgrade, editing persistence.size — the
  # replacement has the same name but a NEW uid, the PV stays `Released` holding the dead uid,
  # and nothing can ever bind to it again. Symptom: PVC Pending forever and the pod stuck on
  #   FailedScheduling: 1 node(s) didn't find available persistent volumes to bind
  # while the pod is repeatedly recreated, which reads like a crash loop but is not one.
  #
  # Omitting claimRef entirely (what this file did before) is just as bad: the PV binds to
  # whichever PVC claims it first, Kubernetes fills in that uid, and you are back to the above
  # on the first recreation.
  #
  # namespace + name and NO uid means "reserved for any PVC with this name" — it re-binds to
  # each new generation automatically.
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: monitoring
    name: monitoring-grafana
  local:
    path: /srv/k8s-volumes/monitoring/grafana
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node1
