# Offsite upload, bolted onto the collection service.
#
# Deliberately a DROP-IN rather than lines in cluster-backup.service: without S3 configured
# the base service still works and stages locally. Install this file only once the bucket,
# credentials and age recipient exist. Absent drop-in, absent upload — no half-configured
# state that fails every night at 02:30.
#
#   sudo install -d -m755 /etc/systemd/system/cluster-backup.service.d
#   sudo install -m644 -T infra/backup/systemd/cluster-backup.service.d/10-s3-upload.conf \
#        /etc/systemd/system/cluster-backup.service.d/10-s3-upload.conf
#   sudo systemctl daemon-reload
#
# To disable again: delete the file and daemon-reload. Collection keeps running.

[Service]
# Bucket, prefix, region, recipient and AWS credentials. Mode 0600, root-owned — it holds a
# secret access key. See s3.env.example.
EnvironmentFile=/etc/cluster-backup/s3.env

# No `-` prefix on purpose. A failed upload MUST mark the unit failed and show up in
# `systemctl --failed`; a backup that silently stops leaving the node is the exact failure
# this whole exercise exists to prevent. The local staging copy is already written by
# ExecStart at this point, so a failure here loses nothing.
ExecStartPost=/opt/cluster-backup/cluster-backup upload

# Uploading several GB over a domestic uplink can take a while, and TimeoutStartSec in the
# base unit covers ExecStart + ExecStartPost combined.
TimeoutStartSec=6h
