apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-pwd
  namespace: devops
spec:
  destination:
    name: ''
    namespace: demo
    server: 'https://kubernetes.default.svc'
  source:
    repoURL: git@github.com:TikTzuki/tiktuzki-gitops.git
    targetRevision: main
    path: charts/my-pwd
    helm:
      valueFiles:
        - values-dev.yaml
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2
