apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: infrastructure
type: Opaque
stringData:
  # Keycloak connects to TimescaleDB as the superuser. postgres-password MUST equal
  # database-secret/postgres-password (timescaledb's postgres password) — fill both with the
  # same real value before deploy. stringData avoids the base64 trailing-newline pitfall.
  admin-password: '<generated>'
  postgres-username: 'postgres'
  postgres-password: 'example'
