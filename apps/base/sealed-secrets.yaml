apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: devops
spec:
  destination:
    namespace: sealed-secrets
    server: https://kubernetes.default.svc
  source:
    # Upstream Helm repo (not a local chart) — Bitnami Labs Sealed Secrets controller.
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    # TODO: pin to the latest released chart version:
    #   helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets
    #   helm search repo sealed-secrets/sealed-secrets --versions | head
    targetRevision: 2.19.1
    helm:
      releaseName: sealed-secrets
      valuesObject:
        # Name the controller so kubeseal's defaults line up:
        #   kubeseal --controller-namespace sealed-secrets --controller-name sealed-secrets-controller
        fullnameOverride: sealed-secrets-controller
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # No infra namespaces are pre-created in bootstraps/namespaces.yaml, so let Argo make it.
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2
