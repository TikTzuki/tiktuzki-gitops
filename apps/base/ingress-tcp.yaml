apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-tcp
  namespace: devops
spec:
  destination:
    # `database` — the IngressRouteTCPs resolve Services in their own namespace, so they
    # live beside the databases rather than beside the controller. Under nginx this app
    # delivered a single ConfigMap into `ingress`; under Traefik it delivers one CR per
    # service into `database`. The matching entryPoints live in apps/base/traefik.yaml.
    namespace: database
    server: https://kubernetes.default.svc
  source:
    repoURL: git@github.com:TikTzuki/tiktuzki-gitops.git
    targetRevision: main
    path: infra/ingress-tcp
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2
