apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-tcp
  namespace: devops
spec:
  destination:
    namespace: ingress
    server: https://kubernetes.default.svc
  source:
    repoURL: git@github.com:TikTzuki/tiktuzki-gitops.git
    targetRevision: main
    path: infra/ingress-tcp
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2
