apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: devops
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.3.0
    helm:
      releaseName: monitoring
      valuesObject:
        # ─── What to scrape ────────────────────────────────────────────────────────
        # ⚠️ The single most important setting here. By default the Prometheus CR only
        # selects ServiceMonitors carrying this release's own labels, so every
        # ServiceMonitor in infra/monitoring/ would be silently ignored — targets simply
        # never appear, with no error anywhere. Setting these to false means "select all
        # ServiceMonitors/PodMonitors/rules in every namespace".
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            scrapeConfigSelectorNilUsesHelmValues: false

            # 15d, not the 10d default — long enough to compare "this week vs last week"
            # while fitting the 20Gi volume. retentionSize is the backstop: Prometheus
            # starts dropping the oldest blocks rather than filling the PV and wedging.
            retention: 15d
            retentionSize: 18GB

            storageSpec:
              volumeClaimTemplate:
                spec:
                  # A class of its own, matched by exactly one static PV in
                  # infra/monitoring/pv.yaml. This cluster has no dynamic provisioner, and a
                  # dedicated class per volume is what makes binding deterministic without
                  # having to predict the operator's generated PVC name.
                  storageClassName: monitoring-prometheus-local
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi

            # Sized for a single 15Gi node that is already ~78% committed on limits. Watch
            # prometheus_tsdb_head_series — if it climbs past ~500k, raise the limit before
            # the OOM killer finds it.
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 1536Mi

        # ─── Grafana ───────────────────────────────────────────────────────────────
        grafana:
          enabled: true
          # Credentials come from a SealedSecret, never from this file.
          # Keys: admin-user, admin-password.
          admin:
            existingSecret: grafana-admin-secret
            userKey: admin-user
            passwordKey: admin-password

          # Small PV so dashboards built in the UI survive a restart. Anything you want
          # reproducible should still be a provisioned dashboard in Git — this is a
          # scratchpad, not a source of truth.
          persistence:
            enabled: true
            type: pvc
            storageClassName: monitoring-grafana-local
            accessModes: ["ReadWriteOnce"]
            size: 2Gi

          ingress:
            enabled: true
            ingressClassName: public
            hosts:
              - grafana.tiktuzki.com
            path: /
            pathType: Prefix

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi

          # ⚠️ Required on microk8s — currently live on the pod, so removing it from this file
          # does not take effect until the next apply, and then breaks things quietly.
          #
          # The two k8s-sidecar containers are Python and verify the API server certificate via
          # OpenSSL 3, which rejects a CA with no keyUsage extension — microk8s's self-signed CA
          # has none:
          #
          #   SSLError: certificate verify failed: CA cert does not include key usage extension
          #
          # The sidecar then CrashLoops (observed reaching 6 restarts), which reads as "Grafana
          # keeps restarting" even though the grafana container is healthy. Two things vanish
          # with it: the provisioned TimescaleDB HA dashboard, and the Prometheus datasource —
          # both arrive through these sidecars.
          #
          # Scope is narrow: verification is disabled only for these sidecars' in-cluster API
          # calls. The alternative is regenerating the microk8s CA, which re-issues every
          # certificate in the cluster.
          sidecar:
            skipTlsVerify: true

          # The OIDC client secret, mounted as a file rather than pasted into grafana.ini.
          # Grafana's $__file{} expansion means the value never appears in this repo, in the
          # rendered ConfigMap, or in `kubectl get cm monitoring-grafana -o yaml`.
          extraSecretMounts:
            - name: grafana-oauth
              secretName: grafana-oauth-secret
              mountPath: /etc/secrets/oauth
              readOnly: true

          grafana.ini:
            server:
              root_url: https://grafana.tiktuzki.com
            users:
              default_theme: dark

            auth:
              # ⚠️ Keep the local login form. It is the break-glass account: if Keycloak is
              # down, its realm is misconfigured, or the client secret drifts, this is the
              # only way back into Grafana — and Grafana is where you look when things are
              # broken. Disabling it makes your monitoring depend on the thing you monitor.
              disable_login_form: false
              # Do not bounce straight to Keycloak; leave the "Sign in with Keycloak" button
              # so the local form stays reachable.
              oauth_auto_login: false

            auth.generic_oauth:
              enabled: true
              name: Keycloak
              icon: signin
              # Realm `homelab`, NOT `master`. master is Keycloak's own administrative realm —
              # putting application clients and end users in it means anyone who can log into
              # Grafana exists in the realm that administers Keycloak itself.
              # This realm name appears in four URLs below; change all four together.
              client_id: grafana
              client_secret: $__file{/etc/secrets/oauth/client-secret}
              scopes: "openid email profile roles"
              auth_url: https://keycloak.tiktuzki.com/realms/homelab/protocol/openid-connect/auth
              token_url: https://keycloak.tiktuzki.com/realms/homelab/protocol/openid-connect/token
              api_url: https://keycloak.tiktuzki.com/realms/homelab/protocol/openid-connect/userinfo
              signout_redirect_url: https://keycloak.tiktuzki.com/realms/homelab/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fgrafana.tiktuzki.com%2Flogin

              email_attribute_path: email
              login_attribute_path: preferred_username
              name_attribute_path: name

              # Maps Keycloak CLIENT roles (resource_access.grafana.roles) to Grafana roles.
              # Client roles rather than realm roles so "admin in Grafana" cannot be granted
              # by accident from a realm-wide role that means something else elsewhere.
              #
              # Requires the `roles` client scope on the client (default in Keycloak) — without
              # it resource_access is absent from the token and everyone lands on Viewer.
              # ⚠️ Note there is NO `|| 'Viewer'` fallback at the end, and that omission is the
              # load-bearing half of this pair. A trailing literal makes the expression always
              # succeed, which makes role_attribute_strict below completely inert — strict only
              # denies login when the expression yields NOTHING. Add a fallback back and you
              # silently re-open Grafana to every user in the realm.
              role_attribute_path: "contains(resource_access.grafana.roles[*], 'admin') && 'Admin' || contains(resource_access.grafana.roles[*], 'editor') && 'Editor'"
              # true: a realm user with no `admin`/`editor` role on the grafana CLIENT is
              # refused, rather than silently provisioned as a Viewer.
              #
              # Keycloak omits a client from resource_access entirely when the user holds zero
              # roles on it — so "no role assigned" and "client absent from the token" are the
              # same observable thing, and both are denied here.
              #
              # Access is now granted ONLY by an explicit Keycloak role assignment. The local
              # login form (auth.disable_login_form = false above) stays as break-glass.
              role_attribute_strict: true
              allow_sign_up: true

              # PKCE closes the authorization-code interception window; Keycloak supports it
              # and Grafana 9+ speaks it.
              use_pkce: true
              # Refresh tokens, so a session survives past the (short) access-token lifetime
              # without bouncing the user back to Keycloak mid-dashboard.
              use_refresh_token: true

        # ─── Alertmanager ──────────────────────────────────────────────────────────
        # Rules live in infra/monitoring/alerts-timescaledb-ha.yaml; this is only routing.
        # Delivery is Telegram — see infra/monitoring/README.md, "Delivering alerts".
        alertmanager:
          enabled: true
          alertmanagerSpec:
            # Mounts the sealed bot token at
            # /etc/alertmanager/secrets/alertmanager-telegram/token. The operator mounts each
            # named Secret under /etc/alertmanager/secrets/<name>/ — the Secret must exist in
            # the `monitoring` namespace or Alertmanager will not start.
            secrets:
              - alertmanager-telegram
            # emptyDir, not a PV. The only durable state Alertmanager holds is silences and
            # the notification log, and a third static local volume is not worth it here —
            # accept that silences are lost on restart.
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi

          config:
            global:
              resolve_timeout: 5m

            route:
              # Group by alert and namespace so a failover that lights up four nodes arrives
              # as one notification rather than four.
              group_by: ["alertname", "namespace"]
              # 30s of collection before the first send — long enough for the related alerts
              # in a failover to arrive together.
              group_wait: 30s
              group_interval: 5m
              # 12h, not the 4h default: on a homelab a re-notify every 4h for something you
              # already know about is how you learn to mute the channel.
              repeat_interval: 12h
              receiver: telegram
              routes:
                # Watchdog fires CONSTANTLY by design — it is kube-prometheus-stack's dead
                # man's switch, proving the alert pipeline is alive. Route it somewhere real
                # only if you have a deadman service (healthchecks.io, Cronitor) watching for
                # its ABSENCE. Delivered anywhere else it is pure noise.
                - matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
                  receiver: "null"
                # PatroniFailoverOccurred is the only info-level alert and it IS worth
                # knowing about — a failover that self-healed before you looked still cost
                # clients ~20-30s of errors. Delivered, but on a 24h repeat so it never nags.
                - matchers: ['severity = "info"']
                  receiver: telegram
                  repeat_interval: 24h

            inhibit_rules:
              # A failover sets off the whole redundancy group at once: replicas stop
              # streaming, lag spikes, HAProxy loses backends, pgdog logs errors. None of
              # that is separately actionable while there is no leader — suppress it so the
              # page says "no leader" rather than listing six symptoms of the same event.
              - source_matchers:
                  - 'alertname =~ "PatroniClusterUnlocked|PatroniNoPrimary"'
                target_matchers:
                  - 'alertname =~ "PatroniReplicaNotStreaming|PatroniReplicationLagHigh|HAProxyNoReplicaBackends|PgdogServerErrors|PatroniNodeDown"'

            receivers:
              # Kept so the Watchdog route has somewhere to go. Do not delete.
              - name: "null"

              - name: telegram
                telegram_configs:
                  # bot_token_file, not bot_token: the token comes from the mounted Secret so
                  # it never appears in this file, in Git, or in `kubectl get alertmanager`.
                  - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/token
                    # TODO: replace with the real chat ID before syncing. Get it by sending
                    # any message to the bot, then:
                    #   curl -s https://api.telegram.org/bot<TOKEN>/getUpdates \
                    #     | jq '.result[-1].message.chat.id'
                    # Group chats are NEGATIVE (e.g. -1001234567890); a DM is positive.
                    # This is an integer, not a string — do not quote it.
                    chat_id: -5342665860
                    # ⚠️ HTML mode makes Telegram REJECT the whole message with a 400 if the
                    # text contains an unescaped <, > or &. Alertmanager does not retry a
                    # 400, so the alert is silently dropped — the worst possible failure for
                    # an alerting channel. Keep those characters out of rule annotations
                    # (they are, as of now), or set parse_mode: "" to make this impossible.
                    parse_mode: HTML
                    send_resolved: true
                    message: |-
                      <b>[{{ .Status | toUpper }}{{ if eq .Status "firing" }} × {{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}</b>
                      {{ range .Alerts }}
                      {{ .Annotations.summary }}
                      {{ .Annotations.description }}
                      {{ end }}

        # ─── microk8s control-plane scrape jobs: off ───────────────────────────────
        # microk8s runs these as host processes bound to localhost, not as pods with the
        # labels the chart's ServiceMonitors expect. Left enabled they produce permanently
        # DOWN targets and a wall of firing *Down alerts that trains you to ignore alerts.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false

        # ─── Node and object metrics ───────────────────────────────────────────────
        nodeExporter:
          enabled: true
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

        kubeStateMetrics:
          enabled: true
        kube-state-metrics:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ⚠️ Required, not optional. The Prometheus/Alertmanager CRDs are hundreds of KB and
      # a client-side apply stuffs the whole manifest into the
      # kubectl.kubernetes.io/last-applied-configuration annotation, which blows the 256KB
      # annotation limit: "metadata.annotations: Too long". Server-side apply has no such
      # round trip.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2
