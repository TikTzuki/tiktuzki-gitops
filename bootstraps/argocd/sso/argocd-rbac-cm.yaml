# Argo CD authorization. Safe to `kubectl apply` — unlike argocd-cm, the live argocd-rbac-cm
# has no data keys, so this file owns it entirely.
#
#   kubectl apply -f bootstraps/argocd/sso/argocd-rbac-cm.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: devops
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  # Which token claims Argo will match `g,` lines against. Without `groups` listed here the
  # claim is ignored even when it is present in the token.
  scopes: '[groups, email]'

  # ⚠️ Empty string = DENY. An authenticated Keycloak user with no matching group gets nothing.
  #
  # The alternative, `role:readonly`, grants every realm user read access to every Application,
  # which on this cluster means the full manifest of every workload. Denying by default matches
  # the choice already made for Grafana (role_attribute_strict) — access comes only from an
  # explicit group assignment.
  policy.default: ''

  policy.csv: |
    # ── Groups ────────────────────────────────────────────────────────────────────
    # `g, <group>, <role>` — the group name must match the `groups` claim EXACTLY.
    #
    # ⚠️ Keycloak's group mapper emits the FULL PATH by default, so a group named
    # `argocd-admins` arrives as `/argocd-admins` with a leading slash and none of these lines
    # match. Either turn OFF "Full group path" on the mapper, or use the slashed form. Both
    # forms are listed below so it works either way — drop whichever you do not use once you
    # have confirmed the claim shape (README has the decode command).
    g, argocd-admins,  role:admin
    g, /argocd-admins, role:admin
    g, argocd-viewers,  role:readonly
    g, /argocd-viewers, role:readonly

    # ── A middle tier: sync but do not mutate ─────────────────────────────────────
    # role:readonly cannot trigger a sync; role:admin can delete Applications and edit
    # repositories and clusters. Most day-to-day work wants exactly the gap between them.
    p, role:operator, applications, get, */*, allow
    p, role:operator, applications, sync, */*, allow
    p, role:operator, applications, action/*, */*, allow
    p, role:operator, logs, get, */*, allow
    p, role:operator, exec, create, */*, deny
    g, argocd-operators,  role:operator
    g, /argocd-operators, role:operator

    # ── The local admin ───────────────────────────────────────────────────────────
    # The built-in `admin` account (argocd-secret/admin.password) keeps full rights and is the
    # break-glass path if Keycloak is down or the groups claim breaks — the same reasoning that
    # keeps Grafana's local login form enabled. Disable it with `admin.enabled: "false"` in
    # argocd-cm only once SSO admin access is proven to work.
    g, admin, role:admin
