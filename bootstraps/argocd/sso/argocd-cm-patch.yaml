# ⚠️ THIS IS A PATCH FILE — DO NOT `kubectl apply` IT.
#
#   kubectl patch cm argocd-cm -n devops --type merge \
#     --patch-file bootstraps/argocd/sso/argocd-cm-patch.yaml
#
# `kubectl apply` would strip every key not listed here. The live argocd-cm carries upstream's
# `resource.customizations.*` and `resource.exclusions` defaults, which control what Argo
# watches and diffs — losing them silently changes reconciliation behaviour across every app.
#
# argocd-cm is not managed by this repo at all: bootstraps/argocd/install.yaml contains only a
# Namespace, ServiceAccount, Service and Ingress. Argo CD itself was installed from upstream, so
# a future re-apply of upstream's install.yaml will reset this ConfigMap and un-configure SSO.
# Re-run this patch afterwards.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: devops
data:
  # ⚠️ REQUIRED for OIDC, and currently unset. Argo builds its redirect URI from this value —
  # with it empty the callback is constructed against the in-cluster address and Keycloak
  # rejects the login with `Invalid parameter: redirect_uri`.
  url: https://argocd.tiktuzki.com

  # Direct OIDC, NOT Dex. Argo bundles Dex as an optional broker; going straight to Keycloak
  # removes a hop and a component. It also changes the callback path — see the README:
  # /auth/callback here, /api/dex/callback if Dex were in the middle.
  oidc.config: |
    name: Keycloak
    issuer: https://keycloak.tiktuzki.com/realms/homelab
    clientID: argocd
    # Resolved from the argocd-oidc-secret Secret at runtime. Any Secret labelled
    # app.kubernetes.io/part-of=argocd can be referenced as $<secret-name>:<key>, which keeps
    # the value out of this ConfigMap and out of Git.
    clientSecret: $argocd-oidc-secret:clientSecret

    # `groups` is the load-bearing one — argocd-rbac-cm matches its `g,` lines against this
    # claim. Without the scope the token has no groups, every user falls through to
    # policy.default, and RBAC appears to do nothing.
    requestedScopes:
      - openid
      - profile
      - email
      - groups

    # Ask Keycloak to put groups in the ID TOKEN, not only at the userinfo endpoint. Argo reads
    # the ID token first; `essential: true` makes Keycloak fail loudly rather than quietly issue
    # a token without them.
    requestedIDTokenClaims:
      groups:
        essential: true
