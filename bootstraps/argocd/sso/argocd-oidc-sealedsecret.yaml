# Client secret for the Argo CD OIDC client, referenced from argocd-cm as
# $argocd-oidc-secret:clientSecret.
#
# ⚠️ The app.kubernetes.io/part-of: argocd label below is REQUIRED and is not decoration.
# Argo CD resolves $<secret>:<key> references only against Secrets carrying it; without the
# label the Secret is invisible to Argo and the server logs:
#
#   config referenced '$argocd-oidc-secret:clientSecret', but key does not exist in secret
#
# which is misleading — the key is fine, the whole object is unreadable. Login then proceeds
# through Keycloak and fails at the token exchange with an empty client secret.
#
# It must live in spec.template.metadata.labels, NOT on the SealedSecret itself: the
# controller stamps the template onto the Secret it generates, so a label added directly to
# the live Secret is dropped on the next reconcile.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-oidc-secret
  namespace: devops
spec:
  encryptedData:
    clientSecret: 
  template:
    metadata:
      name: argocd-oidc-secret
      namespace: devops
      labels:
        app.kubernetes.io/part-of: argocd
