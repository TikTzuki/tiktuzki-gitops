# To install Argo CD, run:
# kubectl apply -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml -n devops

# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: devops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-server
  namespace: devops
---
apiVersion: v1
kind: Service
metadata:
  name: public-argocd-server
  namespace: devops
spec:
  type: NodePort
  ports:
    - name: https
      port: 80
      targetPort: 8080
      protocol: TCP
      nodePort: 30444
  selector:
    app.kubernetes.io/name: argocd-server
---
# ArgoCD UI ingress.
# Public path: browser -> NPM (TLS, *.tiktuzki.com) -> node1:80 hostNetwork ingress
#              -> this rule -> argocd-server (HTTPS backend on 8080).
# backend-protocol HTTPS is required because argocd-server terminates its own TLS,
# so no change to ArgoCD's own config is needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
  namespace: devops
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: public
  rules:
    - host: argocd.tiktuzki.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
