persistence:
  size: 10Gi
  local:
    enabled: true
    node: node1
    path: /home/tik/data/openclaw-helm
    reclaimPolicy: Retain

app-template:
  openclawVersion: "latest"

  controllers:
    main:
      containers:
        main:
          image:
            repository: tiktuzki/openclaw
            tag: "slim"
            pullPolicy: Always
          envFrom:
            - secretRef:
                name: openclaw-helm-env
          env:
            OLLAMA_HOST: "http://ollama.ai-model.svc.cluster.local:11434"
          securityContext: { }
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

  configMaps:
    config:
      data:
        openclaw.json: |
          {
            "gateway": {
              "port": 18789,
              "mode": "local",
              "trustedProxies": ["192.168.1.14"],
              "controlUi": {
                "dangerouslyAllowHostHeaderOriginFallback": true
              }
            },
            "models": {
              "providers": {
                "ollama": {
                  "api": "ollama",
                  "apiKey": "ollama-local",
                  "baseUrl": "http://ollama.ai-model.svc.cluster.local:11434",
                  "models": [
                    {
                      "contextWindow": 32768,
                      "id": "qwen3:8b",
                      "maxTokens": 40960,
                      "name": "qwen3:8b"
                    }
                  ]
                }
              }
            },
            "agents": {
              "defaults": {
                "workspace": "/home/node/.openclaw/workspace",
                "model": {
                  "primary": "ollama/qwen3:8b"
                },
                "userTimezone": "Asia/Ho_Chi_Minh",
                "compaction": {
                  "mode": "safeguard"
                } 
              }
            },
            "channels": {
              "telegram": {
                "enabled": true,
                "botToken": "${TELEGRAM_BOT_TOKEN}",
                "configWrites": false,
                "dmPolicy": "allowlist",
                "allowFrom": [
                  1534702316
                ],
                "groups": {},
                "groupAllowFrom": [],
                "groupPolicy": "open",
                "streaming": "off",
                "actions": {
                  "sendMessage": true,
                  "sticker": true
                }
              }
            }
          }

  service:
    main:
      type: NodePort
      ports:
        http:
          port: 18789
          nodePort: 31789

  persistence:
    data:
      enabled: true

  defaultPodOptions:
    nodeSelector:
      kubernetes.io/hostname: node1

