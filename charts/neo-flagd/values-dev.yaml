# neo-flagd — dev cluster (node1), namespace `demo`.
#
# SSO and RBAC are ON. A caller matching no role can do nothing, so if everyone is locked out
# the `groups` claim is the first thing to check, not the role names — see "If it locks you
# out" at the bottom.

replicaCount: 2

image:
  repository: tiktuzki/neo-flagd
  pullPolicy: Always
  # TODO: pin to a build sha once the image is published, like charts/checkin does. `latest`
  # makes a rollback impossible to describe, and with two replicas a partial rollout can run
  # two different builds against one database.
  tag: "latest"

# ─── Database ────────────────────────────────────────────────────────────────────────────
#
# The HA cluster, in a `flagd` schema of the shared `app` database, as user `app`.
#
# ⚠️ HAProxy's primary port, NOT pgdog. This deviates from the house rule in ACCESS.md that
# applications go through pgdog :6432, and it is deliberate on both counts:
#
#   * Flyway takes a SESSION-level advisory lock to serialise concurrent migrators, and a
#     transaction-mode pooler does not pin a session across statements, so the lock silently
#     fails to hold. ACCESS.md already records the same constraint for Debezium.
#   * pgdog's read/write split buys nothing here. This service answers every read from an
#     in-memory snapshot and touches Postgres only for the 5s revision poll and admin writes,
#     all of which must reach the primary anyway.
#
# :5000 follows the leader on failover, so this survives a Patroni switchover.
database:
  host: timescaledb-ha-haproxy.database
  port: 5000
  name: app
  # Flyway creates this schema if it is missing; `app` owns database `app`, so it may.
  schema: flagd
  username: app
  # Secrets are namespace-scoped, so this is a copy of the HA cluster's pg-password living
  # in `demo`. It is NOT database/timescaledb-ha-secret, which this pod cannot read.
  # See README.md for the kubeseal command.
  existingSecret: neo-flagd-secret
  passwordKey: pg-password
  # Only the revision poll and admin writes cross this pool; reads never do.
  poolSize: 10

flagserver:
  # Leave at 5s. Measured on this codebase: warm-up gets 6 × this value before the process
  # exits, and a refresh that outlasts one interval kills the refresh loop permanently.
  refreshInterval: 5s
  startupTimeout: 60s
  defaultFlagSet: default

# ─── Authentication ──────────────────────────────────────────────────────────────────────
#
# Keycloak client `neo-flagd` in realm `homelab`, registered with:
#   Client authentication  On (confidential)
#   Valid redirect URIs    https://flagd.tiktuzki.com/login/oauth2/code/keycloak
#   Web origins            https://flagd.tiktuzki.com
#
# The callback path ends in `registrationId`, not the client id — rename one and Keycloak has
# to be updated with it.
auth:
  enabled: true
  registrationId: keycloak
  issuerUri: https://keycloak.tiktuzki.com/realms/homelab
  clientId: neo-flagd
  clientName: Keycloak
  # `groups` is what carries authorization. Without the scope the claim is absent, every role
  # below matches nothing, and RBAC denies everyone.
  scope: "openid,profile,email,groups"
  # Becomes the audit-trail actor and the name the console shows. Not `sub`, which is a UUID.
  userNameAttribute: preferred_username
  existingSecret: neo-flagd-secret
  clientSecretKey: client-secret

# ─── Authorization ───────────────────────────────────────────────────────────────────────
#
# Requires a Group Membership mapper on the client emitting `groups` into the ACCESS token —
# id-token-only would leave bearer callers (CI) with no roles at all.
#
# Keycloak emits full paths (`/flag-admins`) unless "Full group path" is off on the mapper, so
# every value below is a regex tolerating both forms. Tighten once you have confirmed the
# shape with: GET /api/v1/me
rbac:
  enabled: true
  rolesClaim: groups
  roles:
    # Everything, everywhere.
    - name: flag-admins
      flagSets: ["*"]
      subjects:
        - { type: role, value: "/?flag-admins", regex: true }
      permissions:
        - { resource: flagset,                actions: [all] }
        - { resource: flag,     value: ".*",  actions: [all] }
        - { resource: audit,                  actions: [view] }
        - { resource: evaluate,               actions: [run] }
        - { resource: appconfig,              actions: [view] }

    # Kill switches only. `toggle` may change defaultVariant and nothing else — the server
    # rebuilds the definition from the stored one — so on-call can turn a feature off at 3am
    # without holding the rights to rewrite how it targets.
    - name: flag-operators
      flagSets: ["*"]
      subjects:
        - { type: role, value: "/?flag-operators", regex: true }
      permissions:
        - { resource: flag, value: ".*", actions: [view, toggle] }
        - { resource: audit,             actions: [view] }
        - { resource: evaluate,          actions: [run] }

    # Read-only. `evaluate` is deliberately withheld: the try-it box reveals how targeting
    # behaves for an arbitrary context, which is more than "view" implies.
    - name: flag-viewers
      flagSets: ["*"]
      subjects:
        - { type: role, value: "/?flag-viewers", regex: true }
      permissions:
        - { resource: flag, value: ".*", actions: [view] }
        - { resource: audit,             actions: [view] }

extraConfig:
  logging:
    level:
      io.summer.flagd: INFO
      io.summer.flagd.rbac: DEBUG

service:
  type: ClusterIP
  port: 8080

# Safe to publish now that auth is on: the console and the admin API both require a session,
# while the sync document, OFREP and the probes stay open because every SDK client and the
# kubelet need them. TLS terminates at NPM, which is why `tls` is empty and why the chart
# sets server.forward-headers-strategy — without it Spring builds an http:// redirect_uri and
# Keycloak rejects it as unregistered.
ingress:
  enabled: true
  className: public
  annotations: {}
  hosts:
    - host: flagd.tiktuzki.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

# ─── If it locks you out ─────────────────────────────────────────────────────────────────
#
# Deny-by-default means a typo in a group name locks out everyone, including you, and it looks
# exactly like a working deny. In order:
#
#   1. GET /api/v1/me — it reports the roles the server actually matched. Empty means the
#      claim did not arrive or did not match, not that your permissions are wrong.
#   2. Check the pod logs for "Roles for … from claim 'groups'" (the DEBUG line above).
#   3. Break glass: set `rbac.enabled: false` and sync. Every authenticated user becomes a
#      full admin, which is bad but recoverable. `auth.enabled: false` is the bigger hammer
#      and also reopens the admin API to anyone who can reach the host — turn the ingress off
#      at the same time if you use it.
