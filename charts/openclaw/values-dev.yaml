nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/openclaw/openclaw
  tag: "latest"
  pullPolicy: Always

# External Ollama — standalone deployment in ai-model namespace running qwen3:8b
ollamaNamespace: ai-model
ollamaHost: "http://ollama.ai-model.svc.cluster.local:11434"
ollamaModel: "qwen3:8b"
sandbox: "true"

ollamaProvider:
  apiKey: "ollama-local"
  baseUrl: "http://ollama.ai-model.svc.cluster.local:11434"
  api: "ollama"
  models:
    - id: 'qwen3:8b'
      name: 'qwen3:8b'
      contextWindow: 40960,
      maxTokens: 40960 * 10

agents:
  defaults:
    model:
      primary: "ollama/qwen3:8b"

extraEnvVars:
  - name: OPENCLAW_DISABLE_BONJOUR
    value: "1"

envFrom: [ ]
# Uncomment and create this secret for API key injection:
# - secretRef:
#     name: openclaw-api-keys

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

persistence:
  enabled: true
  storageClass: ""
  size: 10Gi
  local:
    enabled: true
    node: node1
    path: /home/tik/data/openclaw-data/
    reclaimPolicy: Retain

nodeSelector:
  kubernetes.io/hostname: node1
