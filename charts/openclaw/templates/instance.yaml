apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: {{ include "openclaw.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  image:
    repository: {{ .Values.image.repository }}
    tag: {{ .Values.image.tag | quote }}
    pullPolicy: {{ .Values.image.pullPolicy }}

  # Point to the standalone Ollama in ai-model namespace — no sidecar needed
  ollama:
    enabled: false

  env:
    - name: OLLAMA_HOST
      value: {{ .Values.ollamaHost | quote }}
    {{- with .Values.extraEnvVars }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

  {{- with .Values.envFrom }}
  envFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  config:
    raw:
      models:
        providers:
          ollama:
            {{- toYaml .Values.ollamaProvider | nindent 12 }}
      agents:
        {{- toYaml .Values.agents | nindent 8 }}

  resources:
    {{- toYaml .Values.resources | nindent 4 }}

  storage:
    persistence:
      enabled: true
      {{- if .Values.persistence.local.enabled }}
      existingClaim: {{ include "openclaw.fullname" . }}-data
      {{- else }}
      {{- if .Values.persistence.storageClass }}
      storageClass: {{ .Values.persistence.storageClass | quote }}
      {{- end }}
      size: {{ .Values.persistence.size }}
      accessModes:
        - ReadWriteOnce
      {{- end }}

  {{- with .Values.webTerminal }}
  webTerminal:
    enabled: {{ .enabled }}
    readOnly: {{ .readOnly }}
    {{- with .resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if .credential }}
    credential:
      secretRef:
        name: {{ .credential.secretRef.name }}
    {{- end }}
  {{- end }}
  chromium:
    enabled: true
    image:
      repository: ghcr.io/browserless/chromium
      tag: "v2.40.0"
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
    # Pass extra flags to the Chromium process (useful for anti-bot evasion)
    extraArgs:
      - "--disable-blink-features=AutomationControlled"
      - "--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
    # Inject extra environment variables into the sidecar
    extraEnv:
      - name: DEFAULT_STEALTH
        value: "true"
  networking:
    service:
      type: NodePort
      ports:
        - name: gateway
          port: {{ .Values.service.gatewayPort }}
          nodePort: {{ .Values.service.gatewayNodePort }}
          targetPort: {{ .Values.service.gatewayPort }}
          protocol: TCP
        - name: canvas
          port: {{ .Values.service.canvasPort }}
          protocol: TCP
          nodePort: {{ .Values.service.canvasNodePort }}
          targetPort: {{ .Values.service.canvasPort }}
        - name: web-terminal
          port: {{ .Values.service.webTerminalPort }}
          protocol: TCP
          nodePort: {{ .Values.service.webTerminalNodePort }}
          targetPort: {{ .Values.service.webTerminalPort }}
        - name: browser
          port: {{ .Values.service.browserPort }}
          protocol: TCP
          targetPort: {{ .Values.service.browserPort }}
          nodePort: {{ .Values.service.browserNodePort }}
  security:
    networkPolicy:
      enabled: true
      allowDNS: true
      # Allow ingress from external (NodePort traffic source is node IP after SNAT)
      allowedIngressCIDRs:
        {{- toYaml .Values.networkPolicy.allowedIngressCIDRs | nindent 8 }}
      # Allow HTTPS egress for external APIs
      allowedEgressCIDRs:
        - 0.0.0.0/0
      # Allow port 11434 egress to Ollama in ai-model namespace
      additionalEgress:
        - ports:
            - port: 11434
              protocol: TCP
          to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: {{ .Values.ollamaNamespace | quote }}
    rbac:
      createServiceAccount: true

  {{- with .Values.nodeSelector }}
  availability:
    nodeSelector:
      {{- toYaml . | nindent 6 }}
  {{- end }}
