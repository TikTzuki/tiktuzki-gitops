{{- if and .Values.persistence.enabled .Values.persistence.useLocalVolume }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "timescaledb.fullname" . }}-pv
  labels:
    {{- include "timescaledb.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.persistence.size }}
  volumeMode: Filesystem
  accessModes:
    {{- range .Values.persistence.accessModes }}
    - {{ . | quote }}
    {{- end }}
  persistentVolumeReclaimPolicy: Retain
  {{- if .Values.persistence.storageClass }}
  {{- if (eq "-" .Values.persistence.storageClass) }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  {{- else }}
  storageClassName: ""
  {{- end }}
  local:
    path: {{ .Values.persistence.localPath }}
  {{- with .Values.persistence.nodeAffinity }}
  nodeAffinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
