# Development values for timescaledb.

# TimescaleDB Authentication
auth:
  existingSecret: "timescaledb-secret"
  secretKeys:
    adminPasswordKey: "postgres-password"

# TimescaleDB Configuration
config:
  timescaledbTelemetry: "off"
  # Enable logical decoding (logical replication / CDC, e.g. Debezium).
  # NOTE: wal_level is postmaster-level — applying it requires a full pod RESTART, not a reload.
  # max_wal_senders / max_replication_slots default to 10, which is enough for typical CDC.
  extraConfig:
    - "wal_level = logical"
    - "max_replication_slots = 20"

# Service configuration
service:
  type: ClusterIP
  port: 5432
  targetPort: 5432
  nodePort: 30433

# Persistence configuration
persistence:
  enabled: true
  size: 20Gi
  accessModes:
    - ReadWriteOnce
  useLocalVolume: true
  localPath: /srv/k8s-volumes/timescaledb
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node1

# Resources
resources:
  limits:
    cpu: 1
    memory: 2Gi
  requests:
    cpu: 0.5
    memory: 1Gi
