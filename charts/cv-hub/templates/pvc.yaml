apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cv-hub.fullname" . }}-uploads
  labels:
    {{- include "cv-hub.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
