{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cv-hub.fullname" . }}-uploads
  labels:
    {{- include "cv-hub.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- else if .Values.persistence.useLocalVolume }}
  storageClassName: ""
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.useLocalVolume }}
  selector:
    matchLabels:
      {{- include "cv-hub.selectorLabels" . | nindent 6 }}
  {{- end }}
{{- end }}
