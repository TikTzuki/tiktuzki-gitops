replicaCount: 1

image:
  repository: tiktuzki/cv-hub
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 3000
  nodePort: 32014

env:
  - name: UPLOAD_DIR
    value: /app/backend/uploads
envFrom:
  - secretRef:
      name: cv-hub-env
persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  useLocalVolume: true
  localPath: /srv/k8s-volumes/cv-hub/uploads
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node1

ingress:
  enabled: true
  className: public
  hosts:
    - host: cv-hub.tiktuzki.com
      paths:
        - path: /
          pathType: Prefix
