replicaCount: 1

image:
  repository: tiktuzki/cv-hub
  pullPolicy: Always
  tag: "latest"

service:
  type: NodePort
  port: 80
  nodePort: 32006

env:
  - name: DATABASE_URL
    value: "postgresql+psycopg://postgres:postgres@postgres:5432/cv_hub"
  - name: ANTHROPIC_API_KEY
    value: ""
  - name: UPLOAD_DIR
    value: /app/backend/uploads
envFrom:
  - secretRef:
      name: cv-hub-env
persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  useLocalVolume: true
  localPath: /home/tik/data/cv-hub/uploads
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node1
