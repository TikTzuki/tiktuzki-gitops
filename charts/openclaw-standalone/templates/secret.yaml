{{- if .Values.gatewayToken.generate }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openclaw-standalone.fullname" . }}-token
  labels:
    {{- include "openclaw-standalone.labels" . | nindent 4 }}
  annotations:
    # Keep existing token across Helm upgrades
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ randAlphaNum 32 | b64enc }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openclaw-standalone.fullname" . }}-token
  labels:
    {{- include "openclaw-standalone.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.gatewayToken.value | b64enc }}
{{- end }}
