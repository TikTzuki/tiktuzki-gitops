apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "openclaw-standalone.fullname" . }}
  labels:
    {{- include "openclaw-standalone.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "openclaw-standalone.fullname" . }}
  selector:
    matchLabels:
      {{- include "openclaw-standalone.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openclaw-standalone.labels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true

      # mirrors docker-setup.sh: seed dirs + config + token
      initContainers:
        - name: setup
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              CONFIG=/home/node/.openclaw/openclaw.json

              # skip if already seeded
              if [ -f "$CONFIG" ]; then
                echo "[setup] config exists, skipping"
                exit 0
              fi

              mkdir -p /home/node/.openclaw/identity
              mkdir -p /home/node/.openclaw/workspace

              TOKEN="${OPENCLAW_GATEWAY_TOKEN}"
              cat > "$CONFIG" <<CONF
              {
                "gateway": {
                  "mode": "local",
                  "auth": { "mode": "token", "token": "$TOKEN" },
                  "bind": "lan"
                }
              }
              CONF
              echo "[setup] seeded config with gateway.mode=local"
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "openclaw-standalone.fullname" . }}-token
                  key: token
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw

      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # --allow-unconfigured lets the gateway start before models/agents are fully configured
          # so the user can complete onboarding via the web UI
          command: [ "node", "dist/index.js", "gateway", "--allow-unconfigured" ]
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "openclaw-standalone.fullname" . }}-token
                  key: token
            - name: OPENCLAW_GATEWAY_BIND
              value: "lan"
            - name: OLLAMA_HOST
              value: {{ .Values.ollama.baseUrl | quote }}
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: gateway
              containerPort: 18789
              protocol: TCP
            - name: canvas
              containerPort: 18793
              protocol: TCP
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw

        - name: bash
          image: tsl0922/ttyd:latest
          command: [ "ttyd", "--writable", "-p", "7681", "bash" ]
          ports:
            - name: bash
              containerPort: 7681
              protocol: TCP
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw

      volumes:
        - name: data
          {{- if .Values.persistence.local.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "openclaw-standalone.fullname" . }}-data
          {{- else }}
          emptyDir: { }
          {{- end }}
