apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "openclaw-standalone.fullname" . }}
  labels:
    {{- include "openclaw-standalone.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "openclaw-standalone.fullname" . }}
  selector:
    matchLabels:
      {{- include "openclaw-standalone.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openclaw-standalone.labels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true

      # mirrors: docker compose run --rm openclaw-cli onboard
      initContainers:
        - name: onboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              CONFIG_DIR=/home/node/.openclaw
              CONFIG_FILE=$CONFIG_DIR/openclaw.json

              # skip onboarding if already done
              if [ -f "$CONFIG_FILE" ]; then
                echo "[onboard] config exists, skipping"
                exit 0
              fi

              echo "[onboard] running openclaw-cli onboard..."
              node dist/index.js onboard --non-interactive
              echo "[onboard] done"
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "openclaw-standalone.fullname" . }}-token
                  key: token
            - name: OLLAMA_HOST
              value: {{ .Values.ollama.baseUrl | quote }}
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw

      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # mirrors: docker compose up openclaw-gateway
          command: [ "node", "dist/index.js", "gateway" ]
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "openclaw-standalone.fullname" . }}-token
                  key: token
            - name: OLLAMA_HOST
              value: {{ .Values.ollama.baseUrl | quote }}
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: gateway
              containerPort: 18789
              protocol: TCP
            - name: canvas
              containerPort: 18793
              protocol: TCP
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
            - name: config
              mountPath: /home/node/.openclaw/openclaw.json
              subPath: openclaw.json

      volumes:
        - name: data
          {{- if .Values.persistence.local.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "openclaw-standalone.fullname" . }}-data
          {{- else }}
          emptyDir: { }
          {{- end }}
        - name: config
          configMap:
            name: {{ include "openclaw-standalone.fullname" . }}-config
