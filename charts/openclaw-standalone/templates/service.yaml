apiVersion: v1
kind: Service
metadata:
  name: {{ include "openclaw-standalone.fullname" . }}
  labels:
    {{- include "openclaw-standalone.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "openclaw-standalone.selectorLabels" . | nindent 4 }}
  ports:
    - name: gateway
      port: 18789
      targetPort: 18789
      protocol: TCP
      nodePort: {{ .Values.service.gatewayNodePort }}
    - name: canvas
      port: 18793
      targetPort: 18793
      protocol: TCP
      nodePort: {{ .Values.service.canvasNodePort }}
    - name: bash
      port: 7681
      targetPort: 7681
      protocol: TCP
      nodePort: {{ .Values.service.bashNodePort }}
