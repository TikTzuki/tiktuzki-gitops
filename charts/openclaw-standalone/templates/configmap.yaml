apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openclaw-standalone.fullname" . }}-config
  labels:
    {{- include "openclaw-standalone.labels" . | nindent 4 }}
data:
  openclaw.json: |
    {
      "models": {
        "providers": {
          "ollama": {
            "api": {{ .Values.ollama.api | quote }},
            "apiKey": {{ .Values.ollama.apiKey | quote }},
            "baseUrl": {{ .Values.ollama.baseUrl | quote }}
          }
        }
      },
      "agents": {
        "defaults": {
          "model": {
            "primary": {{ printf "ollama/%s" .Values.ollama.model | quote }}
          },
          "sandbox": {{ .Values.sandbox | toJson }}
        }
      }
    }
