apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openclaw-standalone.fullname" . }}-config
  labels:
    {{- include "openclaw-standalone.labels" . | nindent 4 }}
data:
  # This file is only used as a reference / for re-seeding.
  # The live config is owned by the init container on the data PVC.
  openclaw.json: |
    {
      "gateway": {
        "mode": "local"
      },
      "models": {
        "providers": {
          "ollama": {
            "api": {{ .Values.ollama.api | quote }},
            "apiKey": {{ .Values.ollama.apiKey | quote }},
            "baseUrl": {{ .Values.ollama.baseUrl | quote }},
            "models": [
              {
                "contextWindow": 32768,
                "id": "qwen3:8b",
                "maxTokens": 40960,
                "name": "qwen3:8b"
              }
            ]
          }
        }
      },
      "agents": {
        "defaults": {
          "model": {
            "primary": {{ printf "ollama/%s" .Values.ollama.model | quote }}
          },
          "sandbox": {{ .Values.sandbox | toJson }}
        }
      }
    }
