replicaCount: 1

image:
  repository: ollama/ollama
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: NodePort
  port: 11434
  nodePort: 31434

extraEnvVars:
  - name: OLLAMA_GPU_OVERHEAD
    value: "512000000"    # reserve 512MB VRAM for system (RTX3060 has 12GB)

imagePullSecrets: [ ]
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: { }
  name: ""

podAnnotations: { }
podLabels: { }

runtimeClassName: nvidia   # required for RTX 3060 GPU access

models:
  - qwen3:8b

podSecurityContext:
  supplementalGroups: [ 44, 109 ]  # video/render groups for GPU access

securityContext: { }

resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    cpu: "4"
    memory: 12Gi
    nvidia.com/gpu: 1   # RTX 3060 — 12GB VRAM

livenessProbe:
  httpGet:
    path: /api/version
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /api/version
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 20Gi
  local:
    enabled: true
    node: node1
    path: /home/tik/data/ollama-models/
    reclaimPolicy: Retain

volumes: [ ]
volumeMounts: [ ]

# Pin to node1 where the RTX 3060 is attached
nodeSelector:
  kubernetes.io/hostname: node1

tolerations: [ ]
affinity: { }
