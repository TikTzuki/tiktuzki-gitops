replicaCount: 1

image:
  repository: ollama/ollama
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: [ ]
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: { }
  name: ""

podAnnotations: { }
podLabels: { }

runtimeClassName: ""   # set to "nvidia" to enable GPU

# Models to pull on startup. Leave empty to skip auto-pull.
models: [ ]
# - qwen3:8b

podSecurityContext: { }

securityContext: { }

extraEnvVars: [ ]

service:
  type: NodePort
  port: 11434
  nodePort: 31434

resources: { }

livenessProbe:
  httpGet:
    path: /api/version
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /api/version
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 20Gi
  local:
    enabled: false
    node: node1
    path: /srv/k8s-volumes/ollama-models/
    reclaimPolicy: Retain

volumes: [ ]

volumeMounts: [ ]

nodeSelector: { }

tolerations: [ ]

affinity: { }
