{{- if and .Values.persistence.enabled .Values.persistence.useLocalVolume }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "tigerbeetle.fullname" . }}-pv
  labels:
    {{- include "tigerbeetle.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.persistence.size }}
  volumeMode: Filesystem
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: {{ .Values.persistence.localPath }}
  {{- with .Values.persistence.nodeAffinity }}
  nodeAffinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
