apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tigerbeetle.fullname" . }}
  labels:
    {{- include "tigerbeetle.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tigerbeetle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "tigerbeetle.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tigerbeetle.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: format
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          securityContext:
            seccompProfile:
              type: Unconfined
          command:
            - sh
            - -c
            - |
              echo "Checking for data file: {{ .Values.tigerbeetle.dataFile }}"
              ls -la /data/ || true
              echo "Binary location:"
              ls -la /usr/local/bin/tigerbeetle || true
              which tigerbeetle || true
              echo "Current working directory: $(pwd)"
              if [ ! -f {{ .Values.tigerbeetle.dataFile }} ]; then
                echo "Data file not found, running format..."
                echo "Command: /usr/local/bin/tigerbeetle format --cluster={{ .Values.tigerbeetle.cluster }} --replica={{ .Values.tigerbeetle.replica }} --replica-count={{ .Values.tigerbeetle.replicaCount }} {{ .Values.tigerbeetle.dataFile }}"
                /usr/local/bin/tigerbeetle format --cluster={{ .Values.tigerbeetle.cluster }} --replica={{ .Values.tigerbeetle.replica }} --replica-count={{ .Values.tigerbeetle.replicaCount }} {{ .Values.tigerbeetle.dataFile }}
                echo "Format completed with exit code: $?"
              else
                echo "Data file already exists, skipping format"
              fi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--"
            - "start"
            - "--addresses={{ .Values.tigerbeetle.addresses }}"
            - "{{ .Values.tigerbeetle.dataFile }}"
          ports:
            - name: tb
              containerPort: 3000
              protocol: TCP
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "tigerbeetle.fullname" . }}-pvc
        {{- else }}
        - name: data
          emptyDir: { }
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
