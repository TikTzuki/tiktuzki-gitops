apiVersion: v2
name: x-hrm
description: New Era HRM — recruiting (CV hub + TA weekly report + dashboard) in one image

# One image, one process: uvicorn serves the FastAPI API AND the statically exported Next.js
# UI from the same origin (see the Dockerfile in the x-hrm repo). State lives in Postgres
# plus an uploads volume for CV / JD files.
#
# ⚠️ NOT horizontally scalable as built: AI and import jobs run on an in-process thread pool,
# and on startup the app marks every job still "running" as failed (they cannot be resumed).
# A second replica would kill the other's jobs, hence replicas: 1.
#
# Deploys ARE a RollingUpdate (zero downtime), so old and new pod overlap for a few seconds.
# Accepted cost: a job running on the old pod at that moment is marked failed by the new
# pod's startup sweep and then dies with the old pod — lost, as it was under Recreate, but it
# may briefly show "failed" while still running. Re-run it. The real fix is app-side (job
# ownership + heartbeat in the x-hrm repo). See README.md.
type: application

# Bump on every chart change.
version: 0.3.0

# Application version shipped (matches image.tag once tags are pinned).
appVersion: "0.1.0"
