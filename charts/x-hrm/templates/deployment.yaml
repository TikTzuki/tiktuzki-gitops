apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "x-hrm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Env vars from a Secret are read once at container start — re-sealing the Secret would
    # otherwise leave the pod on the old DATABASE_URL / SECRET_KEY until something restarts
    # it. Requires the opt-in Reloader (apps/base/reloader.yaml).
    reloader.stakater.com/auto: "true"
  labels:
    {{- include "x-hrm.labels" . | nindent 4 }}
spec:
  # Exactly one in steady state — see Chart.yaml. Not a value on purpose.
  replicas: 1
  # Zero-downtime deploys: the new pod starts next to the old one and takes traffic only once
  # /readyz passes; the old pod is stopped after that. The two overlap for a few seconds —
  # an accepted cost, see Chart.yaml for what it does to jobs running at that moment.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # The new pod must stay ready this long before the old one is stopped — a pod that passes
  # /readyz once and then crashes does not take the only working pod down with it.
  minReadySeconds: 5
  selector:
    matchLabels:
      {{- include "x-hrm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "x-hrm.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # The app never talks to the Kubernetes API.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.migrations.enabled }}
      initContainers:
        # Same image, same env. Alembic is idempotent: at head it is a no-op. A failed
        # migration keeps the NEW pod in Init while the old pod keeps serving — the rollout
        # just stalls. maxSurge 1 on one replica means one migrator at a time.
        # ⚠️ The old pod keeps serving on the migrated schema until the new one is ready, so
        # migrations must be backward compatible (expand, deploy, then contract in a later
        # release) — never drop or rename a column the running image still reads.
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [ "alembic", "upgrade", "head" ]
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "x-hrm.env" . | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      {{- end }}
      containers:
        - name: x-hrm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- include "x-hrm.env" . | nindent 12 }}
          {{- with .Values.preStopSleepSeconds }}
          # Endpoint removal and SIGTERM happen at the same time; without this pause Traefik
          # can still route a request to a pod that has stopped listening (a 502 per deploy).
          lifecycle:
            preStop:
              sleep:
                seconds: {{ . }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "x-hrm.fullname" . }}-data
          {{- else }}
          # Uploads vanish with the pod. Only for throwaway environments.
          emptyDir: { }
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
