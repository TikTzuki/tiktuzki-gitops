# Default values for postgres.

# Chart name overrides
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

# Container image
image:
  repository: postgres
  pullPolicy: IfNotPresent
  tag: "16"

imagePullSecrets: [ ]

# PostgreSQL configuration
postgres:
  database: postgres
  username: postgres
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: "postgres-password"

# Persistence configuration
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  useLocalVolume: true
  localPath: /mnt/data/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node1

# Service configuration
service:
  type: NodePort
  port: 5432
  nodePort: 30432

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: { }
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: [ ]

# Service account
serviceAccount:
  create: true
  automount: true
  annotations: { }
  name: ""

# Pod configuration
podAnnotations: { }
podLabels: { }
podSecurityContext: { }
securityContext: { }

# Resources
resources: { }

# Probes
livenessProbe:
  exec:
    command:
      - pg_isready
      - -U
      - postgres
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  exec:
    command:
      - pg_isready
      - -U
      - postgres
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# Additional volumes
volumes: [ ]
volumeMounts: [ ]

# Scheduling
nodeSelector: { }
tolerations: [ ]
affinity: { }
