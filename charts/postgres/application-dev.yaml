apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: devops
spec:
  destination:
    name: ''
    namespace: database
    server: 'https://kubernetes.default.svc'
  source:
    repoURL: 'git@github.com:TikTzuki/tiktuzki-charts.git'  # Update with your repo URL
    targetRevision: main
    path: charts/postgres
    helm:
      values: |
        # PostgreSQL configuration
        postgres:
          database: postgres
          username: postgres
          password: "P@ssword789"  # Use existingSecret in production

        # Persistence configuration with local volume
        persistence:
          enabled: true
          size: 20Gi
          useLocalVolume: true
          localPath: /home/tik/data/postgres
          nodeAffinity:
            required:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - tik  # Change to your actual node name

        # Service configuration
        service:
          type: NodePort
          port: 5432
          nodePort: 30432

        # Resource limits
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi

  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2
