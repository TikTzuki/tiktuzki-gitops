replicaCount: 1

image:
  repository: tiktuzki/my-pwd
  pullPolicy: Always
  tag: "latest"

service:
  type: NodePort
  port: 3000
  nodePort: 32003

env:
  - name: STATIC_DIR
    value: /app/static
  - name: PORT
    value: "3000"

envFrom:
  - secretRef:
      name: my-pwd-env

ingress:
  enabled: true
  className: public
  hosts:
    - host: my-pwd.tiktuzki.com
      paths:
        - path: /
          pathType: Prefix
