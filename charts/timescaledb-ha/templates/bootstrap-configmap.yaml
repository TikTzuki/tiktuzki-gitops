apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tsha.fullname" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tsha.labels" . | nindent 4 }}
data:
  # Patroni bootstrap.post_init hook — runs ONCE, on the first leader, right after initdb.
  # Patroni invokes it as: post-init.sh <superuser-connection-url>
  #
  # Replicas are cloned from the leader with pg_basebackup, so everything created here is
  # replicated automatically. Re-running means deleting every PVC and the {{ .Values.scope }}-*
  # ConfigMaps — see README.md "Wiping and re-bootstrapping".
  post-init.sh: |
    #!/bin/bash
    set -euo pipefail

    CONN="$1"

    # The password arrives as an env var from the Secret, never as an argument — an argument
    # would be visible in `ps` to anything else sharing the pod's PID namespace.
    : "${APP_PASSWORD:?APP_PASSWORD not set - check auth.existingSecret}"
    {{- if .Values.bootstrap.cdc.enabled }}
    : "${DEBEZIUM_PASSWORD:?DEBEZIUM_PASSWORD not set - add auth.secretKeys.debeziumPasswordKey to the Secret}"
    {{- end }}

    # One psql session throughout: \connect keeps the host/port/user from CONN, which sidesteps
    # re-parsing the URL. -v app_pass + :'app_pass' is psql's own quoting — concatenating the
    # password into the SQL text would break on any password containing a quote and would land
    # it in the server log.
    psql "$CONN" -v ON_ERROR_STOP=1 -v app_pass="$APP_PASSWORD"{{ if .Values.bootstrap.cdc.enabled }} -v dbz_pass="$DEBEZIUM_PASSWORD"{{ end }} <<'SQL'
    -- The application role. pgdog authenticates to the backends AS this role, and with
    -- role = "auto" it polls pg_is_in_recovery() / pg_current_wal_lsn() to work out which node
    -- is primary and how far the replicas lag. pg_monitor guarantees those stay readable no
    -- matter how the cluster tightens function ACLs — without it pgdog cannot see the topology
    -- and the read/write split silently stops following failovers.
    CREATE ROLE {{ .Values.bootstrap.username }} LOGIN PASSWORD :'app_pass';
    GRANT pg_monitor TO {{ .Values.bootstrap.username }};

    CREATE DATABASE {{ .Values.bootstrap.database }} OWNER {{ .Values.bootstrap.username }};

    \connect {{ .Values.bootstrap.database }}
    {{- if .Values.bootstrap.createExtension }}

    -- TimescaleDB is a per-DATABASE extension, not a cluster-wide one. A fresh database
    -- without this line is plain PostgreSQL, however the image is named.
    CREATE EXTENSION IF NOT EXISTS timescaledb;
    {{- end }}
    {{- range .Values.bootstrap.schemas }}
    CREATE SCHEMA IF NOT EXISTS {{ . | quote }} AUTHORIZATION {{ $.Values.bootstrap.username }};
    {{- end }}
    {{- if .Values.bootstrap.cdc.enabled }}

    -- ── CDC principal ─────────────────────────────────────────────────────────
    -- REPLICATION lets it open a logical replication connection and read the WAL stream.
    -- Deliberately NOT a superuser, and NOT the `standby` role Patroni uses for physical
    -- replication — a CDC consumer that can also re-clone the cluster is more authority than
    -- the job needs.
    CREATE ROLE {{ .Values.bootstrap.cdc.username }} LOGIN REPLICATION PASSWORD :'dbz_pass';

    -- Group role holding every CDC table grant. debezium inherits them and holds none
    -- directly, so rotating or adding a CDC principal is one GRANT rather than an audit.
    CREATE ROLE {{ .Values.bootstrap.cdc.groupRole }} NOLOGIN;
    GRANT {{ .Values.bootstrap.cdc.groupRole }} TO {{ .Values.bootstrap.cdc.username }};
    GRANT CONNECT ON DATABASE {{ .Values.bootstrap.database }} TO {{ .Values.bootstrap.cdc.username }};

    -- Empty publication. Add tables explicitly as they appear:
    --   ALTER PUBLICATION {{ .Values.bootstrap.cdc.publication }} ADD TABLE <schema>.<table>;
    -- NOT "FOR ALL TABLES": the publication decides what is decoded, but SELECT decides what a
    -- snapshot can read — an all-tables publication hands the CDC role your whole dataset.
    {{- if .Values.bootstrap.cdc.readAllData }}

    -- Database-wide read for the group role. pg_read_all_data is a PG14+ predefined role
    -- covering every table in every schema, existing and future — no per-table GRANT and no
    -- ALTER DEFAULT PRIVILEGES bookkeeping (which is easy to get wrong: it only applies to
    -- objects created by the role named in FOR ROLE, not by whoever runs it).
    --
    -- Note it is CLUSTER-wide, not scoped to this database.
    GRANT pg_read_all_data TO {{ .Values.bootstrap.cdc.groupRole }};
    {{- end }}
    {{- if .Values.bootstrap.cdc.publicationSchemas }}

    -- FOR TABLES IN SCHEMA (PG15+): future tables in these schemas are included automatically.
    CREATE PUBLICATION {{ .Values.bootstrap.cdc.publication }} FOR TABLES IN SCHEMA {{ join ", " .Values.bootstrap.cdc.publicationSchemas }};
    {{- else }}

    -- Empty publication. Populate with:
    --   ALTER PUBLICATION {{ .Values.bootstrap.cdc.publication }} ADD TABLE <schema>.<table>;
    CREATE PUBLICATION {{ .Values.bootstrap.cdc.publication }};
    {{- end }}
    {{- end }}
    {{- with .Values.bootstrap.extraSQL }}
    {{- . | nindent 4 }}
    {{- end }}
    SQL

    echo "post-init: role {{ .Values.bootstrap.username }}, database {{ .Values.bootstrap.database }}, {{ len .Values.bootstrap.schemas }} schema(s)"
