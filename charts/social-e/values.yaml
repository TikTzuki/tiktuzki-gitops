# Default values for social-e
replicaCount: 1

image:
  repository: tiktuzki/social-e
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: [ ]
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: { }
  name: ""

podAnnotations: { }
podLabels: { }

podSecurityContext: { }

securityContext: { }

# Backend service configuration
backend:
  port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

# Frontend service configuration
frontend:
  port: 3000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

service:
  type: ClusterIP
  backendPort: 8000
  frontendPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: { }
  hosts:
    - host: social.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
        - path: /health
          pathType: Prefix
          service: backend
  tls: [ ]

# Environment variables
env:
  # Database
  DATABASE_URL: "postgresql+asyncpg://postgres:password@postgres:5432/social"
  # Redis
  REDIS_URL: "redis://redis:6379"
  # CORS
  ALLOWED_ORIGINS: "http://localhost:3000"
  # JWT
  SECRET_KEY: "change-me-in-production"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"

# Secrets (use external secrets in production)
secrets:
  create: true
  # API Keys - set via --set or external secret management
  GOOGLE_TTS_API_KEY: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  ELEVENLABS_API_KEY: ""

# External secrets reference (if using external-secrets operator)
externalSecrets:
  enabled: false
  secretStore: ""
  refreshInterval: "1h"

resources:
  limits:
    cpu: 1500m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /health
    port: backend
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: backend
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: { }

tolerations: [ ]

affinity: { }

# PostgreSQL dependency (if deploying PostgreSQL with this chart)
postgresql:
  enabled: false
  auth:
    postgresPassword: ""
    database: social

# Redis dependency (if deploying Redis with this chart)
redis:
  enabled: false
