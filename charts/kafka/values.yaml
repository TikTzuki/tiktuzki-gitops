# Default values for kafka (KRaft, single-node combined broker+controller).

# Chart name overrides
nameOverride: ""
fullnameOverride: ""

# Number of pods. This chart is designed for a single combined-mode node (broker+controller).
# Scaling >1 also requires raising the replication factors below and pre-provisioning one
# local PV per replica (see persistence).
replicaCount: 1

# Container image
image:
  repository: apache/kafka
  tag: "3.9.1"
  pullPolicy: IfNotPresent

imagePullSecrets: [ ]

# KRaft cluster id used to format the log dir on FIRST boot only (ignored once formatted).
# Keep this stable across restarts. Regenerate with: kafka-storage.sh random-uuid
clusterId: "5L6g3nShT-eMCtK--X86sw"

kafka:
  # Broker (client) listener — used by in-cluster clients.
  clientPort: 9092
  # Controller listener — internal KRaft quorum traffic only (never advertised to clients).
  controllerPort: 9093
  # JVM heap. Keep below the container memory limit.
  heapOpts: "-Xmx1g -Xms1g"
  # Where Kafka stores its log segments (the data volume is mounted here).
  logDirs: /var/lib/kafka/data
  # Topic defaults. For a single broker these MUST be 1.
  replicationFactor: 1
  minInsyncReplicas: 1
  numPartitions: 1
  autoCreateTopics: true
  # Extra KAFKA_* env vars merged verbatim into the container (e.g. KAFKA_LOG_RETENTION_HOURS).
  extraConfig: { }
  resources: { }

# Authentication. SASL/SCRAM-SHA-512 is applied ONLY to the EXTERNAL listener — in-cluster
# clients (and kafka-ui) keep using the trusted PLAINTEXT listener, and the KRaft controller +
# inter-broker traffic stay PLAINTEXT. Mirrors the ewallet compose security model.
# NOTE: SASL_PLAINTEXT authenticates clients but does NOT encrypt traffic (SCRAM protects the
# password via challenge-response, but payloads are cleartext). Use SASL_SSL for real encryption.
auth:
  # Requires external.enabled (auth secures the external listener). No-op otherwise.
  enabled: false
  mechanism: SCRAM-SHA-512
  username: admin
  # Password source: existingSecret+passwordKey wins; otherwise the inline password.
  password: ""
  existingSecret: ""
  passwordKey: kafka-admin-password
  # Seed the SCRAM user via a post-sync Job against the internal plaintext listener (idempotent).
  seedCredentials: true

# External listener for clients OUTSIDE the cluster (host / NetBird overlay), fronted by the
# ingress-tcp stream on node1. When enabled, the broker advertises EXTERNAL://<host>:<port>
# so external clients reconnect to an address they can actually reach.
external:
  enabled: true
  port: 9094
  # Address external clients use to reach node1's external port. Empty => the pod's own node IP
  # (Downward API status.hostIP). Set explicitly to node1's NetBird/LAN address if status.hostIP
  # is not the interface clients use.
  advertisedHost: ""

# Data volume. The chart provisions a STANDALONE PVC (pvc.yaml) that the StatefulSet mounts by
# name — deliberately NOT a volumeClaimTemplate, so storage lives outside the StatefulSet's
# immutable spec and chart changes never trigger "forbidden update to statefulset spec".
#   enabled: false -> emptyDir (ephemeral; data lost on restart)
#   enabled: true  -> creates {{fullname}}-pvc; with useLocalVolume also creates a node-local PV
#                     (pv.yaml) and binds the PVC to it by label.
#   existingClaim  -> mount that PVC instead of creating one.
# NOTE: a single shared PVC supports replicaCount: 1 (this chart's single-node design). For
# multiple brokers you would need per-pod claims (volumeClaimTemplates) instead.
persistence:
  enabled: true
  storageClass: ""
  # Create + bind a node-local PersistentVolume (hostPath-style). Requires localPath + nodeAffinity.
  useLocalVolume: false
  localPath: ""
  size: 8Gi
  accessModes:
    - ReadWriteOnce
  # nodeAffinity for the local PV (required when useLocalVolume).
  nodeAffinity: { }
  # Mount an existing PVC instead of provisioning one.
  existingClaim: ""

# Client-facing service. In-cluster clients bootstrap against <fullname>.<ns>.svc:clientPort.
service:
  type: ClusterIP
  # Only used when type: NodePort
  clientNodePort: ""

# Service account
serviceAccount:
  create: true
  automount: true
  annotations: { }
  name: ""

# Pod configuration
podAnnotations: { }
podLabels: { }
# The apache/kafka image runs as uid/gid 1000; fsGroup lets it write the (chowned) data volume.
podSecurityContext:
  fsGroup: 1000
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false

# Kafka UI — a web dashboard for the broker (kafbat/kafka-ui, the maintained successor to the
# archived provectuslabs/kafka-ui). Stateless; connects to the broker over the in-cluster
# PLAINTEXT listener. Exposed as a normal HTTP Ingress (it is a web app, unlike the broker).
kafkaUi:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/kafbat/kafka-ui
    # Pin a release from https://github.com/kafbat/kafka-ui/releases for reproducible deploys.
    tag: "latest"
    pullPolicy: IfNotPresent
  # Display name of the cluster inside the UI.
  clusterName: kafka
  # Allow editing cluster config from the UI (stored in-memory unless a config volume is added).
  dynamicConfigEnabled: true
  # Dashboard login. type: DISABLED (open) | LOGIN_FORM (shared user/pass) | OAUTH2 (Keycloak SSO).
  auth:
    type: DISABLED
    # Used when type: LOGIN_FORM
    loginForm:
      username: admin
      existingSecret: ""
      passwordKey: kafka-ui-password
    # Used when type: OAUTH2. Register a confidential OIDC client in Keycloak with redirect URI:
    #   https://<kafka-ui host>/login/oauth2/code/keycloak
    oauth2:
      clientId: kafka-ui
      clientName: Keycloak
      # OIDC issuer: https://<keycloak-host>/realms/<realm>
      issuerUri: ""
      scope: openid
      # Secret holding the Keycloak-generated client secret (secretKeyRef).
      existingSecret: kafka-ui-oauth
      clientSecretKey: client-secret
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: public
    annotations: { }
    hosts:
      - host: kafka-ui.tiktuzki.com
        paths:
          - path: /
            pathType: Prefix
    tls: [ ]
  # Extra environment variables (KAFKA_CLUSTERS_0_* etc.) merged verbatim.
  extraEnv: { }
  podAnnotations: { }
  podSecurityContext: { }
  securityContext: { }
  resources: { }
  nodeSelector: { }
  tolerations: [ ]
  affinity: { }

# Fallback resources if kafka.resources is unset
resources: { }

# Scheduling
nodeSelector: { }
tolerations: [ ]
affinity: { }
