apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka.headlessServiceName" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  # The pod must resolve its own DNS name during bootstrap (before it passes readiness),
  # so expose not-ready addresses too.
  publishNotReadyAddresses: true
  ports:
    - name: client
      port: {{ .Values.kafka.clientPort }}
      targetPort: client
      protocol: TCP
    - name: controller
      port: {{ .Values.kafka.controllerPort }}
      targetPort: controller
      protocol: TCP
    {{- if .Values.external.enabled }}
    - name: external
      port: {{ .Values.external.port }}
      targetPort: external
      protocol: TCP
    {{- end }}
  selector:
    {{- include "kafka.selectorLabels" . | nindent 4 }}
