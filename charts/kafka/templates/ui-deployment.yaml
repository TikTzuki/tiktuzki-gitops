{{- if .Values.kafkaUi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kafka.ui.fullname" . }}
  labels:
    {{- include "kafka.ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.kafkaUi.replicaCount }}
  selector:
    matchLabels:
      {{- include "kafka.ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.kafkaUi.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kafka.ui.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kafkaUi.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kafka-ui
          {{- with .Values.kafkaUi.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.kafkaUi.image.repository }}:{{ .Values.kafkaUi.image.tag }}"
          imagePullPolicy: {{ .Values.kafkaUi.image.pullPolicy }}
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: {{ .Values.kafkaUi.clusterName | quote }}
            # Connect over the in-cluster PLAINTEXT listener; the broker advertises its headless
            # DNS name, which resolves from this namespace.
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "{{ include "kafka.fullname" . }}:{{ .Values.kafka.clientPort }}"
            - name: DYNAMIC_CONFIG_ENABLED
              value: {{ .Values.kafkaUi.dynamicConfigEnabled | quote }}
            {{- if eq .Values.kafkaUi.auth.type "LOGIN_FORM" }}
            - name: AUTH_TYPE
              value: "LOGIN_FORM"
            - name: SPRING_SECURITY_USER_NAME
              value: {{ .Values.kafkaUi.auth.loginForm.username | quote }}
            - name: SPRING_SECURITY_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "kafkaUi.auth.loginForm.existingSecret is required for LOGIN_FORM" .Values.kafkaUi.auth.loginForm.existingSecret }}
                  key: {{ .Values.kafkaUi.auth.loginForm.passwordKey }}
            {{- else if eq .Values.kafkaUi.auth.type "OAUTH2" }}
            {{- $o := .Values.kafkaUi.auth.oauth2 }}
            {{- $id := upper $o.provider }}
            - name: AUTH_TYPE
              value: "OAUTH2"
            # Build redirect URIs from the X-Forwarded-* headers set by NPM/ingress, so the
            # OAuth2 callback uses the external https URL instead of the in-cluster http one.
            # Redirect URI to register with the provider: <kafka-ui host>/login/oauth2/code/{{ $o.provider }}
            - name: SERVER_FORWARDHEADERSSTRATEGY
              value: "NATIVE"
            - name: AUTH_OAUTH2_CLIENT_{{ $id }}_PROVIDER
              value: {{ $o.provider | quote }}
            - name: AUTH_OAUTH2_CLIENT_{{ $id }}_CLIENTID
              value: {{ required "kafkaUi.auth.oauth2.clientId is required for OAUTH2" $o.clientId | quote }}
            - name: AUTH_OAUTH2_CLIENT_{{ $id }}_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "kafkaUi.auth.oauth2.existingSecret is required for OAUTH2" $o.existingSecret }}
                  key: {{ $o.clientSecretKey }}
            - name: AUTH_OAUTH2_CLIENT_{{ $id }}_SCOPE
              value: {{ $o.scope | quote }}
            - name: AUTH_OAUTH2_CLIENT_{{ $id }}_CLIENT_NAME
              value: {{ $o.clientName | quote }}
            - name: AUTH_OAUTH2_CLIENT_{{ $id }}_USER_NAME_ATTRIBUTE
              value: {{ $o.userNameAttribute | quote }}
            {{- if $o.issuerUri }}
            # issuer-uri: needed for keycloak/generic OIDC; omitted for google (built-in endpoints).
            - name: AUTH_OAUTH2_CLIENT_{{ $id }}_ISSUER_URI
              value: {{ $o.issuerUri | quote }}
            {{- end }}
            {{- if eq $o.provider "google" }}
            - name: AUTH_OAUTH2_CLIENT_{{ $id }}_CUSTOM_PARAMS_TYPE
              value: "google"
            {{- with $o.allowedDomain }}
            # Restrict logins to this Google Workspace domain.
            - name: AUTH_OAUTH2_CLIENT_{{ $id }}_CUSTOM_PARAMS_ALLOWEDDOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.kafkaUi.rbac.enabled }}
            # ⚠️ An exact FILE path, not a directory. Spring Boot given a directory location
            # loads only files named application.{yaml,yml,properties} from it — a file called
            # rbac.yaml is silently ignored. That failure is invisible and dangerous: no config
            # loads, kafka-ui sees zero roles, and with zero roles defined it grants EVERY
            # authenticated user full admin, including topic creation.
            #
            # Directory locations must end in "/", file locations must not.
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/etc/kafka-ui-rbac/rbac.yaml"
            {{- end }}
            {{- range $k, $v := .Values.kafkaUi.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          {{- with .Values.kafkaUi.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.kafkaUi.rbac.enabled }}
          volumeMounts:
            # RBAC lives here as real YAML rather than the ~30 indexed env vars
            # (RBAC_ROLES_0_PERMISSIONS_3_ACTIONS_1 …) the same policy would need otherwise.
            #
            # ⚠️ Deliberately NOT /etc/kafkaui — that is kafka-ui's own config directory, where
            # it reads and (with DYNAMIC_CONFIG_ENABLED) WRITES dynamic_config.yaml. Mounting a
            # read-only ConfigMap over it shadows that file and breaks dynamic config.
            - name: rbac-config
              mountPath: /etc/kafka-ui-rbac
              readOnly: true
          {{- end }}
      {{- if .Values.kafkaUi.rbac.enabled }}
      volumes:
        - name: rbac-config
          configMap:
            name: {{ include "kafka.ui.fullname" . }}-rbac
      {{- end }}
      {{- with .Values.kafkaUi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kafkaUi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kafkaUi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
