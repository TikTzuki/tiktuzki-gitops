{{- if .Values.kafkaUi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kafka.ui.fullname" . }}
  labels:
    {{- include "kafka.ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.kafkaUi.replicaCount }}
  selector:
    matchLabels:
      {{- include "kafka.ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.kafkaUi.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kafka.ui.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kafkaUi.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kafka-ui
          {{- with .Values.kafkaUi.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.kafkaUi.image.repository }}:{{ .Values.kafkaUi.image.tag }}"
          imagePullPolicy: {{ .Values.kafkaUi.image.pullPolicy }}
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: {{ .Values.kafkaUi.clusterName | quote }}
            # Connect over the in-cluster PLAINTEXT listener; the broker advertises its headless
            # DNS name, which resolves from this namespace.
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "{{ include "kafka.fullname" . }}:{{ .Values.kafka.clientPort }}"
            - name: DYNAMIC_CONFIG_ENABLED
              value: {{ .Values.kafkaUi.dynamicConfigEnabled | quote }}
            {{- if eq .Values.kafkaUi.auth.type "LOGIN_FORM" }}
            - name: AUTH_TYPE
              value: "LOGIN_FORM"
            - name: SPRING_SECURITY_USER_NAME
              value: {{ .Values.kafkaUi.auth.loginForm.username | quote }}
            - name: SPRING_SECURITY_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "kafkaUi.auth.loginForm.existingSecret is required for LOGIN_FORM" .Values.kafkaUi.auth.loginForm.existingSecret }}
                  key: {{ .Values.kafkaUi.auth.loginForm.passwordKey }}
            {{- else if eq .Values.kafkaUi.auth.type "OAUTH2" }}
            - name: AUTH_TYPE
              value: "OAUTH2"
            # Build redirect URIs from the X-Forwarded-* headers set by NPM/ingress, so the
            # OAuth2 callback uses the external https URL instead of the in-cluster http one.
            - name: SERVER_FORWARDHEADERSSTRATEGY
              value: "NATIVE"
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_PROVIDER
              value: "keycloak"
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_CLIENTID
              value: {{ .Values.kafkaUi.auth.oauth2.clientId | quote }}
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "kafkaUi.auth.oauth2.existingSecret is required for OAUTH2" .Values.kafkaUi.auth.oauth2.existingSecret }}
                  key: {{ .Values.kafkaUi.auth.oauth2.clientSecretKey }}
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_SCOPE
              value: {{ .Values.kafkaUi.auth.oauth2.scope | quote }}
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_ISSUER_URI
              value: {{ required "kafkaUi.auth.oauth2.issuerUri is required for OAUTH2" .Values.kafkaUi.auth.oauth2.issuerUri | quote }}
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_CLIENT_NAME
              value: {{ .Values.kafkaUi.auth.oauth2.clientName | quote }}
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_USER_NAME_ATTRIBUTE
              value: "preferred_username"
            {{- end }}
            {{- range $k, $v := .Values.kafkaUi.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          {{- with .Values.kafkaUi.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.kafkaUi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kafkaUi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kafkaUi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
