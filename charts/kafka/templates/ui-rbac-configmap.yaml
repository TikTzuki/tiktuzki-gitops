{{- if .Values.kafkaUi.rbac.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kafka.ui.fullname" . }}-rbac
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka.ui.labels" . | nindent 4 }}
data:
  # Merged over the env-var config via SPRING_CONFIG_ADDITIONAL_LOCATION (see ui-deployment).
  #
  # ⚠️ Enabling RBAC is deny-by-default: once `rbac.roles` is non-empty, a user matching NO
  # role sees an empty UI rather than the whole cluster. That is the point, but it means a
  # typo in a group name locks everyone out — including you. Verify the `groups` claim shape
  # before relying on it (see charts/kafka/README or the sso notes).
  rbac.yaml: |
    # ─── OAuth role extraction ──────────────────────────────────────────────────
    # Set HERE rather than as AUTH_OAUTH2_CLIENT_<ID>_CUSTOM_PARAMS_ROLES_FIELD, because
    # custom-params is a Map and `roles-field` is a hyphenated key. Spring's relaxed binding
    # cannot tell CUSTOM_PARAMS_ROLES_FIELD apart from custom-params.roles.field or
    # custom_params.roles_field — the underscores are ambiguous, and a map key that binds to
    # the wrong name is simply absent with no error.
    #
    # That matters more than it sounds: with roles-field unset, kafka-ui extracts NO roles,
    # every RBAC subject of type `role` matches nothing, and users are denied everything —
    # which is exactly what a correctly-grouped user reports as "cannot access topics".
    #
    # In YAML the key is written literally, so there is nothing to infer.
    auth:
      oauth2:
        client:
          {{ .Values.kafkaUi.auth.oauth2.provider }}:
            custom-params:
              # `oauth` selects the generic OIDC extractor. NOT `keycloak` — kafbat's docs
              # specify the generic value for Keycloak.
              type: oauth
              roles-field: {{ .Values.kafkaUi.rbac.rolesField | quote }}

    rbac:
      roles:
        {{- range .Values.kafkaUi.rbac.roles }}
        - name: {{ .name | quote }}
          # `clusters` is matched by EXACT NAME — kafka-ui supports no wildcard or regex here
          # (unlike a permission's `value`). Omitting it in values therefore does not mean
          # "all"; it means the chart fills in every cluster it knows about, which is the
          # closest safe equivalent.
          #
          # It also removes a whole bug class: a role naming `kafka-dev` while
          # kafkaUi.clusterName says something else silently matches nothing, and the user is
          # denied with no indication which of the two names is wrong.
          #
          # ⚠️ "every cluster the CHART knows" = kafkaUi.clusterName. A second cluster wired up
          # by hand through extraEnv (KAFKA_CLUSTERS_1_NAME) is invisible here and must be
          # listed explicitly in the role.
          clusters:
            {{- range (default (list $.Values.kafkaUi.clusterName) .clusters) }}
            - {{ . | quote }}
            {{- end }}
          subjects:
            {{- range .subjects }}
            # provider `oauth` + type `role` matches the values kafka-ui extracts from the
            # token field named by CUSTOM_PARAMS_ROLES_FIELD. Only `user` and `role` are valid
            # types for the generic oauth provider — `group` exists only for cognito/ldap.
            - provider: {{ .provider | default "oauth" | quote }}
              type: {{ .type | quote }}
              value: {{ .value | quote }}
              {{- if .regex }}
              regex: true
              {{- end }}
            {{- end }}
          permissions:
            {{- range .permissions }}
            - resource: {{ .resource | quote }}
              {{- with .value }}
              value: {{ . | quote }}
              {{- end }}
              actions:
                {{- range .actions }}
                - {{ . | quote }}
                {{- end }}
            {{- end }}
        {{- end }}
{{- end }}
