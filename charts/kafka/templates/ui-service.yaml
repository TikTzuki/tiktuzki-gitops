{{- if .Values.kafkaUi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka.ui.fullname" . }}
  labels:
    {{- include "kafka.ui.labels" . | nindent 4 }}
spec:
  type: {{ .Values.kafkaUi.service.type }}
  ports:
    - name: http
      port: {{ .Values.kafkaUi.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kafka.ui.selectorLabels" . | nindent 4 }}
{{- end }}
