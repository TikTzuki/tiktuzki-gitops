# Development values for kafka (single-node KRaft homelab on node1).

replicaCount: 1

image:
  tag: "3.9.1"

# Stable dev cluster id. Regenerate with kafka-storage.sh random-uuid if you wipe the volume.
clusterId: "5L6g3nShT-eMCtK--X86sw"

kafka:
  replicationFactor: 1
  minInsyncReplicas: 1
  numPartitions: 1
  resources:
    limits:
      cpu: "1"
      memory: 1536Mi
    requests:
      cpu: 250m
      memory: 768Mi

# Require SASL/SCRAM-SHA-512 on the external listener (node1:9094). Internal listener and
# kafka-ui stay plaintext. Admin password comes from the in-repo database-secret.
auth:
  enabled: true
  username: admin
  existingSecret: kafka-secret
  passwordKey: kafka-admin-password
  seedCredentials: true

# Reachable from the host/overlay on node1:9094 via the ingress-tcp stream configmap.
# advertisedHost empty => the pod's node IP (status.hostIP). If clients reach node1 over a
# different interface (e.g. NetBird), set this to that address.
external:
  enabled: true
  port: 9094
  # Advertise the NetBird overlay address so external clients reconnect to a reachable host.
  # Using the IP (not the hostname) avoids depending on client-side NetBird DNS resolution;
  # works whether the client bootstraps via 100.66.97.47:9094 or node1.netbird.selfhosted:9094.
  advertisedHost: "node1.netbird.selfhosted"

# Kafka UI dashboard, exposed at kafka-ui.tiktuzki.com (NPM -> node1:80 -> public ingress).
kafkaUi:
  enabled: true
  clusterName: kafka-dev
  # SSO via Keycloak (realm `homelab`), replacing the previous direct-to-Google OAuth client.
  #
  # Register the client in Keycloak with:
  #   Client ID                   kafka-ui
  #   Client authentication       On  (confidential)
  #   Valid redirect URIs         https://kafka-ui.tiktuzki.com/login/oauth2/code/keycloak
  #   Web origins                 https://kafka-ui.tiktuzki.com
  # The redirect path ends in the PROVIDER name below, not the client id — change `provider`
  # and the URI Keycloak must accept changes with it.
  #
  # Then re-seal kafka-ui-oauth with the Keycloak client secret (key: client-secret). The
  # existing Secret still holds the Google one, so SSO stays broken until it is replaced.
  auth:
    type: OAUTH2
    oauth2:
      provider: keycloak
      clientId: kafka-ui
      clientName: Keycloak
      # preferred_username, not email: it is what appears in the audit log and in RBAC
      # `type: user` subjects, and it is stable even if a user changes their address.
      userNameAttribute: preferred_username
      # `groups` is what carries authorization — without the scope the claim is absent, every
      # role below matches nothing, and RBAC silently denies everyone.
      scope: "openid,profile,email,groups"
      issuerUri: https://keycloak.tiktuzki.com/realms/homelab
      allowedDomain: ""            # google-only; ignored for keycloak
      existingSecret: kafka-ui-oauth
      clientSecretKey: client-secret

  extraEnv:
    # custom-params.type / roles-field are set in the mounted rbac.yaml instead — see the
    # comment there about Spring's env-var binding being ambiguous for hyphenated map keys.
    #
    # Temporary, until RBAC is confirmed working: logs the roles kafka-ui extracts from the
    # token and the access decisions it makes. Without this, a denial and a "no roles found"
    # look identical from the outside. Remove once verified.
    LOGGING_LEVEL_IO_KAFBAT_UI_SERVICE_RBAC: "DEBUG"
    LOGGING_LEVEL_IO_KAFBAT_UI_CONFIG_AUTH: "DEBUG"

  # ⚠️ Deny-by-default once enabled. Group names must match the `groups` claim EXACTLY —
  # Keycloak's mapper emits the full path (`/kafka-admins`) unless "Full group path" is turned
  # OFF on the mapper. Both forms are listed via regex so it works either way; tighten once you
  # have confirmed the claim shape.
  rbac:
    enabled: true
    # The token claim kafka-ui reads roles from. Keycloak's Group Membership mapper writes
    # `groups`; a client-roles mapper would write `resource_access.<client>.roles`, which this
    # flat lookup cannot reach — hence groups rather than client roles for this app.
    rolesField: groups
    roles:
      # Full control of the dev cluster.
      - name: kafka-admins
        # No `clusters:` — the chart fills in every cluster it knows about (kafkaUi.clusterName).
        # Set it explicitly only to scope a role to a subset.
        subjects:
          - provider: oauth
            type: role
            value: "/?kafka-admins"
            regex: true
        permissions:
          # No wildcard exists for `resource`, so every resource is listed explicitly.
          # "all" covers every action available on that resource.
          - { resource: applicationconfig, actions: ["all"] }
          - { resource: clusterconfig,     actions: ["all"] }
          - { resource: topic,     value: ".*", actions: ["all"] }
          - { resource: consumer,  value: ".*", actions: ["all"] }
          - { resource: schema,    value: ".*", actions: ["all"] }
          - { resource: connect,   value: ".*", actions: ["all"] }
          - { resource: acl,                    actions: ["all"] }

      # Read-only: browse topics and consumer groups, read messages, change nothing.
      - name: kafka-viewers
        subjects:
          - provider: oauth
            type: role
            value: "/?kafka-viewers"
            regex: true
        permissions:
          - { resource: clusterconfig, actions: ["view"] }
          # messages_read is deliberate and worth a thought: topic payloads may contain PII,
          # so "viewer" here is not automatically a safe tier. Drop it to make this
          # metadata-only.
          - { resource: topic,    value: ".*", actions: ["view", "messages_read"] }
          - { resource: consumer, value: ".*", actions: ["view"] }
          - { resource: schema,   value: ".*", actions: ["view"] }
  ingress:
    enabled: true
    className: public
    annotations: { }
    hosts:
      - host: kafka-ui.tiktuzki.com
        paths:
          - path: /
            pathType: Prefix
    tls: [ ]
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi

# Durable node-local volume on node1 (same pattern as timescaledb).
persistence:
  enabled: true
  useLocalVolume: true
  localPath: /home/tik/data/kafka
  size: 20Gi
  accessModes:
    - ReadWriteOnce
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node1
