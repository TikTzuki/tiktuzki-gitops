# Development values for kafka (single-node KRaft homelab on node1).

replicaCount: 1

image:
  tag: "3.9.1"

# Stable dev cluster id. Regenerate with kafka-storage.sh random-uuid if you wipe the volume.
clusterId: "5L6g3nShT-eMCtK--X86sw"

kafka:
  replicationFactor: 1
  minInsyncReplicas: 1
  numPartitions: 1
  resources:
    limits:
      cpu: "1"
      memory: 1536Mi
    requests:
      cpu: 250m
      memory: 768Mi

# Require SASL/SCRAM-SHA-512 on the external listener (node1:9094). Internal listener and
# kafka-ui stay plaintext. Admin password comes from the in-repo database-secret.
auth:
  enabled: true
  username: admin
  existingSecret: database-secret
  passwordKey: kafka-admin-password
  seedCredentials: true

# Reachable from the host/overlay on node1:9094 via the ingress-tcp stream configmap.
# advertisedHost empty => the pod's node IP (status.hostIP). If clients reach node1 over a
# different interface (e.g. NetBird), set this to that address.
external:
  enabled: true
  port: 9094
  # Advertise the NetBird overlay address so external clients reconnect to a reachable host.
  # Using the IP (not the hostname) avoids depending on client-side NetBird DNS resolution;
  # works whether the client bootstraps via 100.66.97.47:9094 or node1.netbird.selfhosted:9094.
  advertisedHost: "node1.netbird.selfhosted"

# Kafka UI dashboard, exposed at kafka-ui.tiktuzki.com (NPM -> node1:80 -> public ingress).
kafkaUi:
  enabled: true
  clusterName: kafka-dev
  # SSO via Keycloak. Create the OIDC client first (see deploy notes) and a kafka-ui-oauth secret
  # holding its client-secret. Set issuerUri to the realm you register the client in.
  # Sign in with Google directly (no Keycloak). Create an OAuth client in Google Cloud Console
  # with redirect URI https://kafka-ui.tiktuzki.com/login/oauth2/code/google, then put its client
  # secret in the kafka-ui-oauth secret (key client-secret). Set clientId below.
  auth:
    type: OAUTH2
    oauth2:
      provider: google
      clientId: 596742570337-asvjj8n18ejkha8l23julahful47jnpi.apps.googleusercontent.com # TODO: <id>.apps.googleusercontent.com
      clientName: Google
      userNameAttribute: email
      scope: "openid,email,profile"
      issuerUri: ""                # not needed for google
      allowedDomain: ""            # optional: e.g. newera.inc to restrict to your Workspace
      existingSecret: kafka-ui-oauth
      clientSecretKey: client-secret
  ingress:
    enabled: true
    className: public
    annotations: { }
    hosts:
      - host: kafka-ui.tiktuzki.com
        paths:
          - path: /
            pathType: Prefix
    tls: [ ]
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi

# Durable node-local volume on node1 (same pattern as timescaledb).
persistence:
  enabled: true
  useLocalVolume: true
  localPath: /home/tik/data/kafka
  size: 20Gi
  accessModes:
    - ReadWriteOnce
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node1
