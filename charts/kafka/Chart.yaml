apiVersion: v2
name: kafka
description: Apache Kafka (KRaft mode, single-node combined broker+controller) for Kubernetes

# A StatefulSet running Kafka in KRaft mode (no ZooKeeper). In combined mode a single pod
# acts as both broker and controller. A headless service gives the pod a stable DNS name,
# used for the in-cluster advertised listener and the KRaft controller quorum — so the
# identity survives pod restarts (unlike pod IPs). An optional EXTERNAL listener is exposed
# to the host/overlay via the ingress-tcp stream configmap.
type: application

# Bump on every chart change.
version: 1.5.0

# Kafka version shipped (matches image.tag).
appVersion: "3.9.1"
